<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบห้องเรียน</title>
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ใช้ฟอนต์ Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- ไอคอน (Heroicons) -->
    <script src="https://unpkg.com/heroicons@2.1.3/24/outline/index.js"></script>
    
    <style>
        /* ใช้ฟอนต์ Sarabun สำหรับภาษาไทย และ Inter สำหรับภาษาอังกฤษ */
        body {
            font-family: 'Sarabun', 'Inter', sans-serif;
        }
        /* ซ่อนลูกศรของ input[type=number] */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a0aec0;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- App Container -->
    <div id="app-container" class="max-w-6xl mx-auto p-4 md:p-8">
        <!-- Main Application UI -->
        <div id="app-content" class="min-h-screen">
            <!-- Loading Spinner -->
            <div id="loading" class="fixed inset-0 bg-white bg-opacity-75 flex items-center justify-center z-50">
                <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-blue-500"></div>
                <p class="ml-4 text-lg font-semibold">กำลังโหลดข้อมูล...</p>
            </div>
            
            <!-- App content will be rendered here by JavaScript -->
        </div>
    </div>

    <!-- Modal Container -->
    <div id="modal-container"></div>
    

    <!-- Firebase SDK -->
    <script type="module">
        // นำเข้าโมดูล Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            onAuthStateChanged,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signOut
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            setDoc, 
            addDoc, 
            updateDoc, 
            deleteDoc, 
            onSnapshot, 
            collection, 
            query, 
            where, 
            getDocs,
            Timestamp,
            setLogLevel
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- GLOBAL STATE ---
        let db, auth, appId;
        let currentUserAuth = null; // เก็บข้อมูล user ที่ login (จาก Auth)
        let currentUserProfile = null; // เก็บข้อมูล user (จาก Firestore)
        let userId = null; // เก็บ uid
        let userRole = 'pending'; // เพิ่ม: 'pending', 'student', 'teacher'
        
        let currentView = 'loading'; // 'loading', 'login', 'register', 'app'
        
        // --- เพิ่ม: State สำหรับการนำทางภายในแอป ---
        let currentTeacherView = 'users'; // 'users', 'documents', 'assignments'
        let currentStudentView = 'documents'; // 'documents', 'submissions', 'history'
        
        let documents = []; // เก็บเอกสาร
        let assignments = []; // เก็บงานที่สั่ง
        
        let myDownloads = []; // ประวัติโหลดของนักเรียน
        let mySubmissions = []; // ประวัติส่งงานของนักเรียน
        let allUsers = []; // เพิ่ม: สำหรับครูใช้จัดการ
        let allSubmissions = []; // เพิ่ม: สำหรับครูดูสรุปคะแนน
        
        let currentModal = null; // Modal ที่กำลังเปิดอยู่
        let modalData = {}; // ข้อมูลสำหรับ Modal
        
        // Listeners Unsubscribers
        let listeners = [];
        
        // --- COLLECTIONS PATHS ---
        const getCollectionPath = (collectionName) => {
            if (!appId) throw new Error("App ID is not set");
            // ใช้ public path เพื่อให้ครูและนักเรียนเห็นข้อมูลชุดเดียวกัน
            return `/artifacts/${appId}/public/data/${collectionName}`;
        };
        
        const documentsPath = () => getCollectionPath("documents");
        const assignmentsPath = () => getCollectionPath("assignments");
        const downloadLogsPath = () => getCollectionPath("downloadLogs");
        const submissionsPath = () => getCollectionPath("submissions");
        const usersPath = () => getCollectionPath("users"); // เพิ่ม: Collection สำหรับเก็บ Role

        // --- INITIALIZATION ---
        window.onload = async () => {
            try {
                // 1. Get Config
                // appId = typeof __app_id !== 'undefined' ? __app_id : 'default-classroom-app';
                // const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
                
                // --- START: อัปเดตด้วย Config ที่คุณให้มา ---
                // Your web app's Firebase configuration
                const firebaseConfig = {
                    apiKey: "AIzaSyCqax0IdvYgaU3pQyAjYKad2WAfc0l0tpI",
                    authDomain: "classroom-2f761.firebaseapp.com",
                    projectId: "classroom-2f761",
                    storageBucket: "classroom-2f761.firebasestorage.app",
                    messagingSenderId: "1000272941555",
                    appId: "1:1000272941555:web:07672098f97067db160286",
                    measurementId: "G-VMMVKXN6W2"
                };
                
                // ตั้งค่า appId ให้ตรงกับ projectId เพื่อใช้ในการสร้าง path ของฐานข้อมูล
                appId = firebaseConfig.projectId || 'default-classroom-app';
                // --- END: อัปเดตด้วย Config ที่คุณให้มา ---

                // 2. Initialize Firebase
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                setLogLevel('Debug');

                // 3. Auth State Listener
                onAuthStateChanged(auth, (user) => {
            cleanupListeners(); // ล้าง listeners เก่าทุกครั้งที่ auth state เปลี่ยน
            if (user) {
                currentUserAuth = user;
                userId = user.uid;
                console.log("Authenticated User:", user.email, user.uid);
                // 5. Setup Listeners
                setupDataListeners(user.uid); // <--- แก้ไข
                        // 6. Initial Render
                currentView = 'app';
            } else {
                currentUserAuth = null;
                currentUserProfile = null;
                userId = null;
                console.log("User is not signed in.");
                        currentView = 'login';
                    }
                    render();
                    // ซ่อน Loading
                    document.getElementById("loading").style.display = 'none';
                });
            } catch (error) {
                console.error("Initialization Error:", error);
                document.getElementById("loading").innerHTML = `<p class="text-red-500">เกิดข้อผิดพลาดในการเริ่มต้น: ${error.message}</p>`;
            }
        };

        // --- DATA LISTENERS ---
        function cleanupListeners() {
            listeners.forEach(unsub => unsub());
            listeners = [];
            console.log("All listeners cleaned up.");
        }

        // --- DATA LISTENERS --- (ลบฟังก์ชันที่ซ้ำซ้อน)
        /*
        function cleanupListeners() {
            console.log("All listeners cleaned up.");
        }
        */

        // แก้ไข: เพิ่มการดึง Role
        async function setupDataListeners(currentUserId) {
            if (!db || !currentUserId) return;
            console.log("Setting up listeners for user:", currentUserId);

            // 1. ดึง Role และ Profile ของ User ปัจจุบันก่อน
            const userDocRef = doc(db, usersPath(), currentUserId);
            listeners.push(onSnapshot(userDocRef, (doc) => {
                if (doc.exists()) {
                    currentUserProfile = doc.data(); // เก็บ Profile ทั้งหมด
                    userRole = currentUserProfile.status || 'pending';
                } else {
                    currentUserProfile = null; // ไม่มี Profile ใน DB
                    userRole = 'pending'; // ถ้ายังไม่มีใน DB ก็คือรออนุมัติ
                }
                console.log("Current User Role:", userRole);
                
                // --- เพิ่ม: ตั้งค่า View เริ่มต้นตาม Role ---
                if (userRole === 'teacher') {
                    setupTeacherOnlyListeners();
                    currentTeacherView = 'users'; // หน้าแรกของครูคือจัดการผู้ใช้
                }
                if (userRole === 'student') {
                    currentStudentView = 'documents'; // หน้าแรกของนักเรียนคือดาวน์โหลด
                }
                
                render(); // Render ใหม่เมื่อ Role ชัดเจน
            }, (error) => {
                console.error("Error listening to user role:", error);
                userRole = 'pending';
                render();
            }));

            // 2. Listener for Documents (Public)
            const docsQuery = query(collection(db, documentsPath()));
            listeners.push(onSnapshot(docsQuery, (snapshot) => {
                documents = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                documents.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                render();
            }, (error) => console.error("Error listening to documents:", error)));

            // 3. Listener for Assignments (Public)
            const assignmentsQuery = query(collection(db, assignmentsPath()));
            listeners.push(onSnapshot(assignmentsQuery, (snapshot) => {
                assignments = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                assignments.sort((a, b) => (a.deadline?.toMillis() || 0) - (b.deadline?.toMillis() || 0));
                render();
            }, (error) => console.error("Error listening to assignments:", error)));
            
            // 4. Listener for MY Submissions (Student History)
            const mySubQuery = query(collection(db, submissionsPath()), where("userId", "==", currentUserId));
            listeners.push(onSnapshot(mySubQuery, (snapshot) => {
                mySubmissions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                mySubmissions.sort((a, b) => (b.timestamp?.toMillis() || 0) - (a.timestamp?.toMillis() || 0));
                render();
            }, (error) => console.error("Error listening to my submissions:", error)));
            
            // 5. Listener for MY Downloads (Student History)
            const myDownQuery = query(collection(db, downloadLogsPath()), where("userId", "==", currentUserId));
            listeners.push(onSnapshot(myDownQuery, (snapshot) => {
                myDownloads = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                myDownloads.sort((a, b) => (b.timestamp?.toMillis() || 0) - (a.timestamp?.toMillis() || 0));
                render();
            }, (error) => console.error("Error listening to my downloads:", error)));
        }
        
        // เพิ่ม: Listener สำหรับครูเท่านั้น
        function setupTeacherOnlyListeners() {
            // ดึง User ทั้งหมดมาให้ครูจัดการ
            const allUsersQuery = query(collection(db, usersPath()));
            listeners.push(onSnapshot(allUsersQuery, (snapshot) => {
                allUsers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                // เรียงตามสถานะ
                allUsers.sort((a, b) => (a.status === 'pending' ? -1 : 1) - (b.status === 'pending' ? -1 : 1) || a.email.localeCompare(b.email));
                render();
            }, (error) => console.error("Error listening to all users:", error)));
            
            // เพิ่ม: ดึง Submissions ทั้งหมดมาให้ครูทำ Gradebook
            const allSubQuery = query(collection(db, submissionsPath()));
            listeners.push(onSnapshot(allSubQuery, (snapshot) => {
                allSubmissions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                render(); // Render ใหม่เมื่อมีข้อมูลสรุปคะแนน
            }, (error) => console.error("Error listening to all submissions:", error)));
        }

        // --- RENDERING ---
        
        function render() {
            const appContent = document.getElementById("app-content");
            if (!appContent) return;
            
            switch (currentView) {
                case 'login':
                    appContent.innerHTML = renderLoginView();
                    break;
                case 'register':
                    appContent.innerHTML = renderRegisterView();
                    break;
                case 'app':
                    appContent.innerHTML = `
                        ${renderHeader()}
                        <main>
                            ${renderAppBody()}
                        </main>
                    `;
                    break;
                case 'loading':
                    // Loading spinner is shown by default
                    break;
            }
            
            // Render Modals
            document.getElementById("modal-container").innerHTML = renderModals();
            attachModalEventHandlers();
        }
        
        // เพิ่ม: ฟังก์ชันเลือก View ตาม Role
        function renderAppBody() {
            switch (userRole) {
                case 'teacher':
                    return renderTeacherView();
                case 'student':
                    return renderStudentView();
                case 'pending':
                default:
                    return renderPendingView();
            }
        }
        
        // เพิ่ม: ฟังก์ชันเลือก View ตาม Role
        // เพิ่ม: หน้าสำหรับรออนุมัติ
        function renderPendingView() {
            return `
                <div class="flex items-center justify-center" style="height: 60vh;">
                    <div class="w-full max-w-md p-8 text-center bg-white rounded-lg shadow-lg">
                        <h2 class="text-2xl font-bold text-yellow-600 mb-4">รอการอนุมัติ</h2>
                        <p class="text-gray-700">บัญชีของคุณ (${currentUser?.email}) กำลังรอการอนุมัติจากคุณครู</p>
                        <p class="text-gray-700 mt-2">กรุณาติดต่อคุณครูเพื่อเปิดใช้งานบัญชี</p>
                    </div>
                </div>
            `;
        }

        // --- AUTH VIEWS ---
        function renderLoginView() {
            return `
                <div class="flex items-center justify-center min-h-screen">
                    <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-lg shadow-lg">
                        <h2 class="text-3xl font-bold text-center text-blue-600">เข้าสู่ระบบ</h2>
                        <form id="login-form" class="space-y-4">
                            <input id="login-email" type="email" placeholder="Email" class="w-full p-3 border rounded-md" required>
                            <input id="login-password" type="password" placeholder="Password" class="w-full p-3 border rounded-md" required>
                            <button type="submit" class="w-full bg-blue-500 text-white p-3 rounded-md hover:bg-blue-600 transition-colors font-semibold">เข้าสู่ระบบ</button>
                        </form>
                        <p class="text-center">
                            ยังไม่มีบัญชี? <button onclick="window.switchToRegister()" class="text-blue-600 hover:underline">ลงทะเบียน</button>
                        </p>
                    </div>
                </div>
            `;
        }

        function renderRegisterView() {
            return `
                <div class="flex items-center justify-center min-h-screen">
                    <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-lg shadow-lg">
                        <h2 class="text-3xl font-bold text-center text-green-600">ลงทะเบียน</h2>
                        <form id="register-form" class="space-y-4">
                            <div class="flex gap-4">
                                <input id="register-firstname" type="text" placeholder="ชื่อจริง" class="w-full p-3 border rounded-md" required>
                                <input id="register-lastname" type="text" placeholder="นามสกุล" class="w-full p-3 border rounded-md" required>
                            </div>
                            <input id="register-email" type="email" placeholder="Email" class="w-full p-3 border rounded-md" required>
                            <input id="register-password" type="password" placeholder="Password (อย่างน้อย 6 ตัวอักษร)" class="w-full p-3 border rounded-md" required>
                            <button type="submit" class="w-full bg-green-500 text-white p-3 rounded-md hover:bg-green-600 transition-colors font-semibold">ลงทะเบียน</button>
                        </form>
                        <p class="text-center">
                            มีบัญชีแล้ว? <button onclick="window.switchToLogin()" class="text-blue-600 hover:underline">เข้าสู่ระบบ</button>
                        </p>
                    </div>
                </div>
            `;
        }

        // --- APP VIEWS ---

        function renderHeader() {
            return `
                <header class="flex flex-col md:flex-row justify-between items-center mb-6 p-4 bg-white rounded-lg shadow-md">
                    <div>
                        <h1 class="text-3xl font-bold text-blue-600">ระบบห้องเรียน (Classroom Hub)</h1>
                        <p class="text-sm text-gray-600">Login ในชื่อ: <span class="font-semibold">${currentUserProfile?.firstName || ''} ${currentUserProfile?.lastName || ''} (${currentUserAuth?.email || 'N/A'})</span></p>
                    </div>
                    <div class="flex items-center mt-4 md:mt-0 space-x-4">
                        <!-- ลบปุ่มสลับโหมด -->
                        <span class="text-sm font-semibold px-3 py-1 rounded-full ${userRole === 'teacher' ? 'bg-blue-100 text-blue-700' : (userRole === 'student' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700')}">
                            สถานะ: ${userRole}
                        </span>
                        <button onclick="window.handleLogout()" class="text-sm bg-red-500 text-white px-3 py-2 rounded-md hover:bg-red-600">ออกจากระบบ</button>
                    </div>
                </header>
            `;
        }

        // --- TEACHER VIEW ---
        // --- ปรับปรุง: เปลี่ยนเป็น Layout แบบ Sidebar Navigation ---
        function renderTeacherView() {
            const navButton = (view, icon, text) => {
                const isActive = currentTeacherView === view;
                return `
                    <button 
                        onclick="window.setTeacherView('${view}')" 
                        class="w-full flex items-center space-x-3 px-4 py-3 rounded-lg transition-colors ${
                            isActive 
                                ? 'bg-blue-100 text-blue-700 font-semibold' 
                                : 'text-gray-600 hover:bg-gray-100 hover:text-gray-800'
                        }"
                    >
                        <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><use href="https://unpkg.com/heroicons@2.1.3/24/outline/index.js#${icon}" /></svg>
                        <span>${text}</span>
                    </button>
                `;
            };

            return `
                <div class="flex flex-col lg:flex-row gap-6">
                    <!-- Sidebar Navigation -->
                    <nav class="w-full lg:w-64 bg-white p-4 rounded-lg shadow-lg flex-shrink-0 self-start">
                        <div class="space-y-2">
                            ${navButton('users', 'users', 'จัดการผู้ใช้งาน')}
                            ${navButton('documents', 'document-duplicate', 'จัดการเอกสาร')}
                            ${navButton('assignments', 'clipboard-document-list', 'จัดการงาน')}
                            ${navButton('gradebook', 'table-cells', 'สรุปคะแนน')}
                        </div>
                    </nav>

                    <!-- Main Content Area -->
                    <main class="flex-1 min-w-0">
                        ${renderTeacherContent()}
                    </main>
                </div>
            `;
        }
        
        // เพิ่ม: ฟังก์ชันสำหรับ Render เนื้อหาของครูตาม View ที่เลือก
        function renderTeacherContent() {
            switch (currentTeacherView) {
                case 'users':
                    return `
                        <div class="bg-white p-6 rounded-lg shadow-lg">
                            <h2 class="text-2xl font-semibold mb-4 border-b pb-2">จัดการผู้ใช้งาน</h2>
                            <div id="user-list" class="space-y-3 max-h-[120vh] overflow-y-auto pr-2">
                                ${allUsers.length === 0
                                    ? '<p class="text-gray-500 text-center">ไม่มีผู้ใช้งาน</p>'
                                    : allUsers.map(user => `
                                    <div class="p-3 rounded-md border ${user.status === 'pending' ? 'bg-yellow-50' : 'bg-gray-50'}">
                                        <p class="font-semibold truncate">${user.firstName || ''} ${user.lastName || ''}</p>
                                        <p class="text-sm text-gray-600 truncate" title="${user.email}">${user.email}</p>
                                        <p class="text-sm">สถานะ: <span class="font-bold">${user.status}</span></p>
                                        ${user.id === currentUserAuth.uid ? '<span class="text-xs text-blue-500">(นี่คือคุณ)</span>' : ''}
                                        ${user.id !== currentUserAuth.uid ? `
                                        <div class="flex space-x-2 mt-2">
                                            ${user.status !== 'student' ? `<button onclick="window.updateUserRole('${user.id}', 'student')" class="text-xs bg-green-500 text-white px-2 py-1 rounded-md hover:bg-green-600">ตั้งเป็นนักเรียน</button>` : ''}
                                            ${user.status !== 'teacher' ? `<button onclick="window.updateUserRole('${user.id}', 'teacher')" class="text-xs bg-blue-500 text-white px-2 py-1 rounded-md hover:bg-blue-600">ตั้งเป็นครู</button>` : ''}
                                            ${user.status !== 'pending' ? `<button onclick="window.updateUserRole('${user.id}', 'pending')" class="text-xs bg-gray-400 text-white px-2 py-1 rounded-md hover:bg-gray-500">ย้ายไปรออนุมัติ</Gbutton>` : ''}
                                        </div>
                                        ` : ''}
                                    </div>
                                    `).join('')
                                }
                            </div>
                        </div>
                    `;
                case 'documents':
                    return `
                        <div class="bg-white p-6 rounded-lg shadow-lg">
                            <h2 class="text-2xl font-semibold mb-4 border-b pb-2">จัดการเอกสารประกอบการเรียน</h2>
                            <!-- Upload Form -->
                            <form id="upload-doc-form" class="mb-6 p-4 border rounded-lg bg-gray-50 space-y-3">
                                <h3 class="text-lg font-semibold">อัปโหลดเอกสารใหม่</h3>
                                <input id="doc-chapter" type="text" placeholder="บทที่ (เช่น 1, 2 หรือ 'สรุป')" class="w-full p-2 border rounded-md">
                                <input id="doc-title" type="text" placeholder="ชื่อเอกสาร" class="w-full p-2 border rounded-md" required>
                                <input id="doc-file-url" type="url" placeholder="URL ของไฟล์ (เช่น Google Drive, PDF)" class="w-full p-2 border rounded-md" required>
                                <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600 transition-colors">อัปโหลด</Dbutton>

        document.addEventListener('submit', (e) => {

                e.preventDefault();
                handleLogin();
            }
            if (e.target.id === 'register-form') {
                e.preventDefault();
                handleRegister();
            }

            // App Forms
            if (e.target.id === 'upload-doc-form') {
                e.preventDefault();
                handleUploadDocument();

            if (e.target.id === 'create-assignment-form') {
                e.preventDefault();
                handleCreateAssignment();

        // Attach handlers for forms *inside* modals
        function attachModalEventHandlers() {
            const downloadForm = document.getElementById('download-log-form');
            if (downloadForm) {
                downloadForm.onsubmit = handleDownloadLog;
            }
            
            const submitWorkForm = document.getElementById('submit-work-form');
            if (submitWorkForm) {
                submitWorkForm.onsubmit = handleSubmitWork;
            }
            
            const extendDeadlineForm = document.getElementById('extend-deadline-form');
            if (extendDeadlineForm) {
                extendDeadlineForm.onsubmit = handleExtendDeadline;
            }
            
            // เพิ่ม:
            const gradeSubmissionForm = document.getElementById('grade-submission-form');
            if (gradeSubmissionForm) {
                gradeSubmissionForm.onsubmit = handleSaveGrade;
            }
        }
        
        // --- MODAL CONTROLS ---
        window.closeModal = () => {
            // Unsubscribe from any active listeners when closing modals
            listeners.forEach(unsub => {
                if(unsub.id === 'modal-listener') unsub.fn();
            });
            listeners = listeners.filter(l => l.id !== 'modal-listener');
            
            currentModal = null;
            modalData = {};
            render(); // Re-render to remove modal
        };
        
        window.closeModalBackground = (event) => {
            if (event.target.id === "modal-content-wrapper") return;
            if (event.target.closest("#modal-content-wrapper") === null) {
                window.closeModal();
            }
        };

        window.showMessage = (message, type = 'info') => {
            currentModal = 'showMessage';
            modalData = { message, type };
            render();
        };
        
        // --- AUTH ACTIONS ---
        window.switchToRegister = () => {
            currentView = 'register';
            render();
        }
        window.switchToLogin = () => {
            currentView = 'login';
            render();
        }
        
        async function handleLogin() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                // onAuthStateChanged จะจัดการที่เหลือ
            } catch (error) {
                console.error("Login error:", error);
                window.showMessage(`เข้าสู่ระบบไม่สำเร็จ: ${error.message}`, 'error');
            }
        }

        // (ครู) Render หน้าสรุปคะแนน
        function renderGradebook() {
            const students = allUsers.filter(u => u.status === 'student');
            const sortedAssignments = [...assignments].sort((a, b) => (a.createdAt?.toMillis() || 0) - (b.createdAt?.toMillis() || 0));

            const getScore = (studentId, assignmentId) => {
                const sub = allSubmissions.find(s => s.userId === studentId && s.assignmentId === assignmentId);
                return sub && sub.isChecked ? sub.score : '-';
            };
            
            const getTotalScore = (studentId) => {
                let total = 0;
                let hasScore = false;
                allSubmissions.forEach(sub => {
                    if (sub.userId === studentId && sub.isChecked && typeof sub.score === 'number') {
                        total += sub.score;
                        hasScore = true;
                    }
                });
                return hasScore ? total : '-';
            };
            
            const getMaxTotal = () => {
                return sortedAssignments.reduce((total, assign) => {
                    return total + (assign.maxScore || 0);
                }, 0);
            };

            return `
                <div class="bg-white p-6 rounded-lg shadow-lg">
                    <div class="flex justify-between items-center mb-4 border-b pb-2">
                        <h2 class="text-2xl font-semibold">สรุปคะแนน (Gradebook)</h2>

                    </div>
                    
                    <div class="overflow-x-auto">

                                        </th>
                                    `).join('')}
                                    <th class="p-3 text-center text-xs font-semibold text-gray-600 uppercase tracking-wider bg-gray-200">
                                        รวม<br>
                                        <span class="font-normal">(เต็ม ${getMaxTotal()})</span>
                                    </th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                                ${students.length === 0 
                                    ? `<tr><td colspan="${sortedAssignments.length + 2}" class="p-4 text-center text-gray-500">ยังไม่มีนักเรียน</td></tr>`

                                    <tr class="hover:bg-gray-50">

                                    ${sortedAssignments.map(assign => `
                                        <td class="p-3 whitespace-nowrap text-sm text-gray-600 text-center border-r">
                                            ${getScore(student.id, assign.id)}
                                            </td>
                                        `).join('')}
                                        <td class="p-3 whitespace-nowrap text-sm font-bold text-gray-800 text-center bg-gray-100">
                                            ${getTotalScore(student.id)}
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }
        
        // (ครู) Export CSV
        window.exportGradebookToCSV = () => {
            const students = allUsers.filter(u => u.status === 'student');
            const sortedAssignments = [...assignments].sort((a, b) => (a.createdAt?.toMillis() || 0) - (b.createdAt?.toMillis() || 0));

            const getScore = (studentId, assignmentId) => {
                const sub = allSubmissions.find(s => s.userId === studentId && s.assignmentId === assignmentId);
                return sub && sub.isChecked ? sub.score : ''; // CSV ว่างดีกว่า '-'
            };
            
            const getTotalScore = (studentId) => {
                let total = 0;
                let hasScore = false;
                allSubmissions.forEach(sub => {
                    if (sub.userId === studentId && sub.isChecked && typeof sub.score === 'number') {
                        total += sub.score;
                        hasScore = true;
                    }
                });
                return hasScore ? total : '';
            };
            
            const getMaxTotal = () => {
                return sortedAssignments.reduce((total, assign) => {
                    return total + (assign.maxScore || 0);
                }, 0);
            };

            let csvContent = "data:text/csv;charset=utf-8,";

            // Header Row
            let header = ["Student Name", "Student Email"];
            sortedAssignments.forEach(assign => {
                header.push(`"${assign.title} (Max: ${assign.maxScore || 'N/A'})"`);
            });
            header.push(`"Total (Max: ${getMaxTotal()})"`);
            csvContent += header.join(",") + "\r\n";

            // Data Rows
            students.forEach(student => {
                let row = [`"${student.firstName || ''} ${student.lastName || ''}"`, `"${student.email}"`];
                sortedAssignments.forEach(assign => {
                    row.push(`"${getScore(student.id, assign.id)}"`);
                });
                row.push(`"${getTotalScore(student.id)}"`);
                csvContent += row.join(",") + "\r\n";
            });

            // Trigger Download
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `gradebook_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

                window.showMessage('ส่งงานเรียบร้อยแล้ว!', 'success');
                
            } catch (error) {
                console.error("Error submitting work: ", error);
                window.showMessage(`เกิดข้อผิดพลาด: ${error.message}`, 'error');
            }
            */
            
            // [FIX 1] เพิ่มโค้ดสำหรับเปิด Modal ที่ถูกต้อง
            currentModal = 'submitPrompt';
            modalData = { assignmentId };
            render();
        }
        
        // [FIX 2] เพิ่มฟังก์ชัน handleSubmitWork ที่หายไป
        async function handleSubmitWork(e) {
            e.preventDefault();
            const assignmentId = e.target.dataset.assignmentId;
            const urlInput = document.getElementById('submission-url');
            
            if (!urlInput || !urlInput.value) {
                window.showMessage('กรุณาป้อน URL ของงาน', 'error');
                return;
            }
            if (!assignmentId) {
                window.showMessage('ไม่พบรหัสงาน', 'error');
                return;
            }
            if (!currentUserAuth) {
                window.showMessage('กรุณาเข้าสู่ระบบก่อน', 'error');
                return;
            }

            const fileUrl = urlInput.value;
            
            try {
                await addDoc(collection(db, submissionsPath()), {
                    assignmentId,
                    userId: currentUserAuth.uid,
                    userEmail: currentUserAuth.email,
                    userName: `${currentUserProfile?.firstName || ''} ${currentUserProfile?.lastName || ''}`,
                    fileUrl: fileUrl,
                    fileName: '',
                    timestamp: Timestamp.now(),
                    isChecked: false,
                    score: null,
                    teacherComment: ""
                });
                
                window.closeModal();
                window.showMessage('ส่งงานเรียบร้อยแล้ว!', 'success');
                
            } catch (error) {
                console.error("Error submitting work: ", error);
                window.showMessage(`เกิดข้อผิดพลาด: ${error.message}`, 'error');
            }
        }
        
        // --- UTILITY ---
        
        function formatTimestamp(fsTimestamp) {
            if (!fsTimestamp) return 'N/A';
            return fsTimestamp.toDate().toLocaleString('th-TH', {
                dateStyle: 'short',
                timeStyle: 'short'
            });
        }
        
        // --- Attach Functions to Window ---
        // window.toggleRole = toggleRole; // <--- ลบบรรทัดนี้ (เกิด Error เพราะฟังก์ชันนี้ไม่มีแล้ว)
        window.showViewDownloaders = showViewDownloaders;
        window.handleDelete = handleDelete;
        window.showViewSubmissions = showViewSubmissions;
        window.showExtendDeadline = showExtendDeadline;
        window.showDownloadPrompt = showDownloadPrompt;
        window.showSubmitPrompt = showSubmitPrompt;
        window.toggleCheckSubmission = toggleCheckSubmission;
        window.handleLogout = handleLogout;
        window.switchToLogin = switchToLogin;
        window.switchToRegister = switchToRegister;
        window.updateUserRole = updateUserRole;
        
        // เพิ่ม: Attach ตัวสลับ View
        window.setTeacherView = setTeacherView;
        window.setStudentView = setStudentView;
        
        // เพิ่ม: Attach ฟังก์ชันใหม่
        window.showGradeModal = showGradeModal;
        window.exportGradebookToCSV = exportGradebookToCSV;

    </script>
