<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบห้องเรียน</title>
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ใช้ฟอนต์ Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- ไอคอน (Heroicons) -->
    <script src="https://unpkg.com/heroicons@2.1.3/24/outline/index.js"></script>
    
    <style>
        /* ใช้ฟอนต์ Sarabun สำหรับภาษาไทย และ Inter สำหรับภาษาอังกฤษ */
        body {
            font-family: 'Sarabun', 'Inter', sans-serif;
        }
        /* ซ่อนลูกศรของ input[type=number] */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a0aec0;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- App Container -->
    <div id="app-container" class="max-w-6xl mx-auto p-4 md:p-8">
        <!-- Main Application UI -->
        <div id="app-content" class="min-h-screen">
            <!-- Loading Spinner -->
            <div id="loading" class="fixed inset-0 bg-white bg-opacity-75 flex items-center justify-center z-50">
                <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-blue-500"></div>
                <p class="ml-4 text-lg font-semibold">กำลังโหลดข้อมูล...</p>
            </div>
            
            <!-- App content will be rendered here by JavaScript -->
        </div>
    </div>

    <!-- Modal Container -->
    <div id="modal-container"></div>
    

    <!-- Firebase SDK -->
    <script type="module">
        // นำเข้าโมดูล Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            onAuthStateChanged,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signOut,
            sendPasswordResetEmail
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            setDoc, 
            addDoc, 
            updateDoc, 
            deleteDoc, 
            onSnapshot, 
            collection, 
            query, 
            where, 
            getDocs,
            Timestamp,
            setLogLevel
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- GLOBAL STATE ---
        let db, auth, appId;
        let currentUserAuth = null; 
        let currentUserProfile = null; 
        let userId = null; 
        let userRole = 'pending'; 
        
        let currentView = 'loading'; 
        
        let currentTeacherView = 'users'; 
        let currentStudentView = 'documents'; 
        
        let documents = []; 
        let assignments = []; 
        let classrooms = []; 
        
        let myDownloads = []; 
        let mySubmissions = []; 
        let allUsers = []; 
        let allSubmissions = []; 
        let roster = []; 
        
        let currentModal = null; 
        let modalData = {}; 
        
        let listeners = [];
        
        // --- COLLECTIONS PATHS ---
        const getCollectionPath = (collectionName) => {
            if (!appId) throw new Error("App ID is not set");
            return `/artifacts/${appId}/public/data/${collectionName}`;
        };
        
        const documentsPath = () => getCollectionPath("documents");
        const assignmentsPath = () => getCollectionPath("assignments");
        const downloadLogsPath = () => getCollectionPath("downloadLogs");
        const submissionsPath = () => getCollectionPath("submissions");
        const usersPath = () => getCollectionPath("users"); 
        const rosterPath = () => getCollectionPath("roster"); 
        const classroomsPath = () => getCollectionPath("classrooms"); 

        // --- INITIALIZATION ---
        window.onload = async () => {
            try {
                // --- START: Config ---
                const firebaseConfig = {
                    apiKey: "AIzaSyCqax0IdvYgaU3pQyAjYKad2WAfc0l0tpI",
                    authDomain: "classroom-2f761.firebaseapp.com",
                    projectId: "classroom-2f761",
                    storageBucket: "classroom-2f761.firebasestorage.app",
                    messagingSenderId: "1000272941555",
                    appId: "1:1000272941555:web:07672098f97067db160286",
                    measurementId: "G-VMMVKXN6W2"
                };
                appId = firebaseConfig.projectId || 'default-classroom-app';
                // --- END: Config ---

                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                setLogLevel('Debug');

                // Auth State Listener
                onAuthStateChanged(auth, (user) => {
                    cleanupListeners(); 
                    
                    if (user) {
                        currentUserAuth = user;
                        userId = user.uid;
                        console.log("Authenticated User:", user.email, user.uid);
                        currentView = 'app';
                        setupDataListeners(user.uid); 
                    } else {
                        currentUserAuth = null;
                        currentUserProfile = null;
                        userId = null;
                        userRole = 'pending';
                        console.log("User is not signed in.");
                        currentView = 'login';
                        setLoading(false); 
                        render(); 
                    }
                });
            } catch (error) {
                console.error("Initialization Error:", error);
                document.getElementById("loading").innerHTML = `<p class="text-red-500">เกิดข้อผิดพลาดในการเริ่มต้น: ${error.message}</p>`;
            }
        };
        
        const setLoading = (isLoading) => {
            const loadingEl = document.getElementById("loading");
            if (loadingEl) {
                loadingEl.style.display = isLoading ? 'flex' : 'none';
            }
        };

        // --- DATA LISTENERS ---
        function cleanupListeners() {
            listeners.forEach(unsub => unsub());
            listeners = [];
            console.log("All listeners cleaned up.");
        }

        async function setupDataListeners(currentUserId) {
            if (!db || !currentUserId) return;
            console.log("Setting up listeners for user:", currentUserId);

            // 1. ดึง Role และ Profile ของ User ปัจจุบันก่อน
            const userDocRef = doc(db, usersPath(), currentUserId);
            listeners.push(onSnapshot(userDocRef, (doc) => {
                if (doc.exists()) {
                    currentUserProfile = doc.data(); 
                    userRole = currentUserProfile.status || 'pending';
                } else {
                    currentUserProfile = null; 
                    userRole = 'pending'; 
                }
                console.log("Current User Role:", userRole);
                
                // 2. เมื่อรู้ Role แล้ว ค่อยโหลดข้อมูลส่วนที่เหลือ
                // โหลด Classrooms ก่อนเสมอ เพราะจำเป็นสำหรับทั้งครูและนักเรียน (ในการแสดงชื่อ)
                const classroomsQuery = query(collection(db, classroomsPath()));
                listeners.push(onSnapshot(classroomsQuery, (snapshot) => {
                    classrooms = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    classrooms.sort((a, b) => a.name.localeCompare(b.name));
                    
                    // หลังจากได้ Classrooms แล้ว ค่อยโหลดส่วนที่เหลือ
                    if (userRole === 'teacher') {
                        setupTeacherListeners();
                        if (!currentTeacherView) currentTeacherView = 'users';
                    } else if (userRole === 'student') {
                        setupStudentListeners(currentUserProfile?.classroomId);
                        if (!currentStudentView) currentStudentView = 'documents';
                    } else {
                        // สำหรับ 'pending'
                        setLoading(false);
                        render();
                    }
                }, (error) => {
                     console.error("Error listening to classrooms:", error);
                     setLoading(false);
                     render();
                }));
                
            }, (error) => {
                console.error("Error listening to user role:", error);
                userRole = 'pending';
                setLoading(false); 
                render();
            }));
        }
        
        // Listener สำหรับครู (โหลดทุกอย่าง)
        function setupTeacherListeners() {
            console.log("Setting up TEACHER listeners (loading all data)");
            
            // Data ที่ยังไม่ได้โหลด
            const collectionsToLoad = [
                { path: usersPath(), stateKey: 'allUsers', queryFn: () => query(collection(db, usersPath())) },
                { path: submissionsPath(), stateKey: 'allSubmissions', queryFn: () => query(collection(db, submissionsPath())) },
                { path: rosterPath(), stateKey: 'roster', queryFn: () => query(collection(db, rosterPath())) },
                { path: documentsPath(), stateKey: 'documents', queryFn: () => query(collection(db, documentsPath())) },
                { path: assignmentsPath(), stateKey: 'assignments', queryFn: () => query(collection(db, assignmentsPath())) }
            ];

            let loadedCount = 0;
            const totalToLoad = collectionsToLoad.length;

            collectionsToLoad.forEach(config => {
                const q = config.queryFn();
                listeners.push(onSnapshot(q, (snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    
                    // Sort specific states
                    if (config.stateKey === 'allUsers') {
                        data.sort((a, b) => (a.status === 'pending' ? -1 : 1) - (b.status === 'pending' ? -1 : 1) || a.email.localeCompare(b.email));
                    } else if (config.stateKey === 'roster') {
                        data.sort((a, b) => a.studentId.localeCompare(b.studentId));
                    } else if (config.stateKey === 'documents') {
                        data.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    } else if (config.stateKey === 'assignments') {
                        data.sort((a, b) => (a.deadline?.toMillis() || 0) - (b.deadline?.toMillis() || 0));
                    }
                    
                    // Assign to global state
                    window[config.stateKey] = data;
                    
                    loadedCount++;
                    if (loadedCount === totalToLoad) {
                        setLoading(false);
                    }
                    render();
                }, (error) => {
                    console.error(`Error listening to ${config.stateKey}:`, error);
                    loadedCount++;
                    if (loadedCount === totalToLoad) {
                        setLoading(false);
                    }
                }));
            });
        }

        // Listener สำหรับนักเรียน (โหลดเฉพาะที่เกี่ยวข้อง)
        function setupStudentListeners(classroomId) {
            console.log(`Setting up STUDENT listeners (Classroom ID: ${classroomId})`);
            if (!classroomId) {
                console.warn("Student has no classroomId. They will only see 'all' content.");
            }
            
            const relevantClassroomIds = ["all", classroomId].filter(Boolean);

            const collectionsToLoad = [
                { 
                    stateKey: 'mySubmissions', 
                    queryFn: () => query(collection(db, submissionsPath()), where("userId", "==", userId)) 
                },
                { 
                    stateKey: 'myDownloads', 
                    queryFn: () => query(collection(db, downloadLogsPath()), where("userId", "==", userId)) 
                },
                { 
                    stateKey: 'documents', 
                    queryFn: () => query(collection(db, documentsPath()), where("classroomId", "in", relevantClassroomIds)) 
                },
                { 
                    stateKey: 'assignments', 
                    queryFn: () => query(collection(db, assignmentsPath()), where("classroomId", "in", relevantClassroomIds)) 
                }
            ];

            let loadedCount = 0;
            const totalToLoad = collectionsToLoad.length;

            collectionsToLoad.forEach(config => {
                const q = config.queryFn();
                listeners.push(onSnapshot(q, (snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                    // Sort specific states
                    if (config.stateKey === 'mySubmissions' || config.stateKey === 'myDownloads') {
                        data.sort((a, b) => (b.timestamp?.toMillis() || 0) - (a.timestamp?.toMillis() || 0));
                    } else if (config.stateKey === 'documents') {
                        data.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    } else if (config.stateKey === 'assignments') {
                        data.sort((a, b) => (a.deadline?.toMillis() || 0) - (b.deadline?.toMillis() || 0));
                    }

                    window[config.stateKey] = data;

                    loadedCount++;
                    if (loadedCount === totalToLoad) {
                        setLoading(false);
                    }
                    render();
                }, (error) => {
                    console.error(`Error listening to ${config.stateKey}:`, error);
                    loadedCount++;
                    if (loadedCount === totalToLoad) {
                        setLoading(false);
                    }
                }));
            });
        }


        // --- RENDERING ---
        
        function render() {
            const appContent = document.getElementById("app-content");
            if (!appContent) return;
            
            switch (currentView) {
                case 'login':
                    appContent.innerHTML = renderLoginView();
                    break;
                case 'register':
                    appContent.innerHTML = renderRegisterView();
                    break;
                case 'app':
                    appContent.innerHTML = `
                        ${renderHeader()}
                        <main>
                            ${renderAppBody()}
                        </main>
                    `;
                    break;
                case 'loading':
                    // Loading spinner is shown by default
                    break;
            }
            
            document.getElementById("modal-container").innerHTML = renderModals();
            attachModalEventHandlers();
        }
        
        function renderAppBody() {
            switch (userRole) {
                case 'teacher':
                    return renderTeacherView();
                case 'student':
                    return renderStudentView();
                case 'pending':
                default:
                    return renderPendingView();
            }
        }
        
        function renderPendingView() {
            return `
                <div class="flex items-center justify-center" style="height: 60vh;">
                    <div class="w-full max-w-md p-8 text-center bg-white rounded-lg shadow-lg">
                        <h2 class="text-2xl font-bold text-yellow-600 mb-4">รอการอนุมัติ</h2>
                        <p class="text-gray-700">บัญชีของคุณ (${currentUserAuth?.email}) กำลังรอการอนุมัติจากคุณครู</p>
                        <p class="text-gray-700 mt-2">กรุณาติดต่อคุณครูเพื่อเปิดใช้งานบัญชี</p>
                    </div>
                </div>
            `;
        }

        // --- AUTH VIEWS ---
        function renderLoginView() {
            return `
                <div class="flex items-center justify-center min-h-screen">
                    <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-lg shadow-lg">
                        <h2 class="text-3xl font-bold text-center text-blue-600">เข้าสู่ระบบ</h2>
                        <form id="login-form" class="space-y-4">
                            <input id="login-email" type="email" placeholder="Email" class="w-full p-3 border rounded-md" required>
                            <input id="login-password" type="password" placeholder="Password" class="w-full p-3 border rounded-md" required>
                            
                            <div class="text-right -mt-2">
                                <button type="button" onclick="window.handleForgotPassword()" class="text-sm font-medium text-blue-600 hover:underline">
                                    ลืมรหัสผ่าน?
                                </button>
                            </div>

                            <button type="submit" class="w-full bg-blue-500 text-white p-3 rounded-md hover:bg-blue-600 transition-colors font-semibold">เข้าสู่ระบบ</button>
                        </form>
                        <p class="text-center">
                            ยังไม่มีบัญชี? <button onclick="window.switchToRegister()" class="text-blue-600 hover:underline">ลงทะเบียน</button>
                        </p>
                    </div>
                </div>
            `;
        }

        // --- START: แก้ไขหน้าลงทะเบียน ---
        function renderRegisterView() {
            return `
                <div class="flex items-center justify-center min-h-screen">
                    <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-lg shadow-lg">
                        <h2 class="text-3xl font-bold text-center text-green-600">ลงทะเบียนนักเรียน</h2>
                        <form id="register-form" class="space-y-4">
                            
                            <input id="register-student-id" type="text" placeholder="รหัสประจำตัวนักเรียน" class="w-full p-3 border rounded-md" required>

                            <!-- ลบช่อง ชื่อ-นามสกุล ออก -->
                            
                            <input id="register-email" type="email" placeholder="Email (สำหรับใช้ Login)" class="w-full p-3 border rounded-md" required>
                            <input id="register-password" type="password" placeholder="Password (อย่างน้อย 6 ตัวอักษร)" class="w-full p-3 border rounded-md" required>
                            
                            <p class="text-xs text-gray-600">หมายเหตุ: คุณจะลงทะเบียนได้ต่อเมื่อครูได้เพิ่ม รหัสประจำตัว ของคุณเข้าระบบแล้วเท่านั้น</p>
                            
                            <button type="submit" class="w-full bg-green-500 text-white p-3 rounded-md hover:bg-green-600 transition-colors font-semibold">ลงทะเบียน</button>
                        </form>
                        <p class="text-center">
                            มีบัญชีแล้ว? <button onclick="window.switchToLogin()" class="text-blue-600 hover:underline">เข้าสู่ระบบ</button>
                        </p>
                    </div>
                </div>
            `;
        }
        // --- END: แก้ไขหน้าลงทะเบียน ---

        // --- APP VIEWS ---

        function renderHeader() {
            let userAffiliation = `สถานะ: ${userRole}`;
            if (userRole === 'student' && currentUserProfile?.classroomId) {
                const classroom = classrooms.find(c => c.id === currentUserProfile.classroomId);
                userAffiliation = `ห้อง: ${classroom?.name || 'ไม่พบห้อง'}`;
            } else if (userRole === 'teacher') {
                userAffiliation = `สถานะ: ครู`;
            }

            return `
                <header class="flex flex-col md:flex-row justify-between items-center mb-6 p-4 bg-white rounded-lg shadow-md">
                    <div>
                        <h1 class="text-3xl font-bold text-blue-600">ระบบห้องเรียน (Classroom Hub)</h1>
                        <p class="text-sm text-gray-600">Login ในชื่อ: <span class="font-semibold">${currentUserProfile?.firstName || ''} ${currentUserProfile?.lastName || ''} (${currentUserAuth?.email || 'N/A'})</span></p>
                    </div>
                    <div class="flex items-center mt-4 md:mt-0 space-x-4">
                        <span class="text-sm font-semibold px-3 py-1 rounded-full ${userRole === 'teacher' ? 'bg-blue-100 text-blue-700' : (userRole === 'student' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700')}">
                            ${userAffiliation}
                        </span>
                        <button onclick="window.handleLogout()" class="text-sm bg-red-500 text-white px-3 py-2 rounded-md hover:bg-red-600">ออกจากระบบ</button>
                    </div>
                </header>
            `;
        }

        // --- TEACHER VIEW ---
        function renderTeacherView() {
            const navButton = (view, icon, text) => {
                const isActive = currentTeacherView === view;
                return `
                    <button 
                        onclick="window.setTeacherView('${view}')" 
                        class="w-full flex items-center space-x-3 px-4 py-3 rounded-lg transition-colors ${
                            isActive 
                                ? 'bg-blue-100 text-blue-700 font-semibold' 
                                : 'text-gray-600 hover:bg-gray-100 hover:text-gray-800'
                        }"
                    >
                        <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><use href="https://unpkg.com/heroicons@2.1.3/24/outline/index.js#${icon}" /></svg>
                        <span>${text}</span>
                    </button>
                `;
            };

            return `
                <div class="flex flex-col lg:flex-row gap-6">
                    <!-- Sidebar Navigation -->
                    <nav class="w-full lg:w-64 bg-white p-4 rounded-lg shadow-lg flex-shrink-0 self-start">
                        <div class="space-y-2">
                            ${navButton('users', 'users', 'จัดการผู้ใช้งาน (อนุมัติ)')}
                            ${navButton('classrooms', 'building-library', 'จัดการห้องเรียน')}
                            ${navButton('roster', 'identification', 'จัดการรายชื่อนักเรียน')}
                            ${navButton('documents', 'document-duplicate', 'จัดการเอกสาร')}
                            ${navButton('assignments', 'clipboard-document-list', 'จัดการงาน')}
                            ${navButton('gradebook', 'table-cells', 'สรุปคะแนน')}
                        </div>
                    </nav>

                    <!-- Main Content Area -->
                    <main class="flex-1 min-w-0">
                        ${renderTeacherContent()}
                    </main>
                </div>
            `;
        }
        
        function renderTeacherContent() {
            const classroomOptions = (includeAll = false) => {
                let options = includeAll ? '<option value="all">สำหรับทุกห้อง</option>' : '';
                options += classrooms.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
                return options;
            };

            switch (currentTeacherView) {
                case 'users':
                    return `
                        <div class="bg-white p-6 rounded-lg shadow-lg">
                            <h2 class="text-2xl font-semibold mb-4 border-b pb-2">จัดการผู้ใช้งาน (อนุมัติครู)</h2>
                            <p class="text-sm text-gray-600 mb-4">ส่วนนี้สำหรับอนุมัติสถานะ "ครู" เท่านั้น (นักเรียนจะถูกอนุมัติอัตโนมัติจากหน้า "จัดการรายชื่อนักเรียน")</p>
                            <div id="user-list" class="space-y-3 max-h-[120vh] overflow-y-auto pr-2">
                                ${allUsers.length === 0
                                    ? '<p class="text-gray-500 text-center">ไม่มีผู้ใช้งาน</p>'
                                    : allUsers.filter(u => u.status !== 'student').map(user => `
                                    <div class="p-3 rounded-md border ${user.status === 'pending' ? 'bg-yellow-50' : 'bg-gray-50'}">
                                        <p class="font-semibold truncate">${user.firstName || ''} ${user.lastName || ''}</p>
                                        <p class="text-sm text-gray-600 truncate" title="${user.email}">${user.email}</p>
                                        <p class="text-sm">สถานะ: <span class="font-bold">${user.status}</span></p>
                                        ${user.id === currentUserAuth.uid ? '<span class="text-xs text-blue-500">(นี่คือคุณ)</span>' : ''}
                                        ${user.id !== currentUserAuth.uid ? `
                                        <div class="flex space-x-2 mt-2">
                                            ${user.status !== 'teacher' ? `<button onclick="window.updateUserRole('${user.id}', 'teacher')" class="text-xs bg-blue-500 text-white px-2 py-1 rounded-md hover:bg-blue-600">ตั้งเป็นครู</button>` : ''}
                                            ${user.status !== 'pending' ? `<button onclick="window.updateUserRole('${user.id}', 'pending')" class="text-xs bg-gray-400 text-white px-2 py-1 rounded-md hover:bg-gray-500">ย้ายไปรออนุมัติ</Gbutton>` : ''}
                                        </div>
                                        ` : ''}
                                    </div>
                                    `).join('')
                                }
                            </div>
                        </div>
                    `;
                case 'classrooms':
                    return `
                        <div class="bg-white p-6 rounded-lg shadow-lg">

                        onclick="window.setStudentView('${view}')" 
                        class="w-full flex items-center space-x-3 px-4 py-3 rounded-lg transition-colors ${

                                ? 'bg-blue-100 text-blue-700 font-semibold'

                        }"

                        <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><use href="https://unpkg.com/heroicons@2.1.3/24/outline/index.js#${icon}" /></svg>

                    </button>
                `;
            };

            return `
                <div class="flex flex-col lg:flex-row gap-6">

                        </div>
                    </nav>
                    <main class="flex-1 min-w-0">
                        ${renderStudentContent()}
                    </main>
                </div>
            `;
        }

                        acc[chapter].push(doc);
                        return acc;

                    return `

                                        </div>
                                    `).join('')
                                }

                        acc[chapter].push(assign);

                    }, {});

                    return `
                        <div class="bg-white p-6 rounded-lg shadow-lg">

                                                        }

                                            </div>
                                        </div>

                case 'history':

        // --- MODALS ---
        function renderModals() {
            if (!currentModal) return '';

            const modalWrapper = (title, content) => `
                <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4" onclick="window.closeModalBackground(event)">
                    <div class="bg-white rounded-lg shadow-2xl w-full max-w-lg p-6" id="modal-content-wrapper">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-xl font-semibold">${title}</h3>
                            <button onclick="window.closeModal()" class="text-gray-400 hover:text-gray-600">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </button>
                        </div>
                        <div id="modal-content">${content}</div>
                    </div>
                </div>
            `;
            
            const classroomOptions = (includeAll = false) => {
                let options = includeAll ? '<option value="all">สำหรับทุกห้อง</option>' : '';
                options += classrooms.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
                return options;
            };

            if (currentModal === 'viewSubmissions') {
                const title = "รายชื่อผู้ส่งงาน";
                const content = `<div id="submission-list-container" class="max-h-80 overflow-y-auto"><p>กำลังโหลดข้อมูล...</p></div>`;
                return modalWrapper(title, content);
            }

            if (currentModal === 'viewDownloaders') {
                const title = "รายชื่อผู้ดาวน์โหลด";
                const content = `<div id="downloader-list-container" class="max-h-80 overflow-y-auto"><p>กำลังโหลดข้อมูล...</p></div>`;
                return modalWrapper(title, content);
            }
            
            if (currentModal === 'extendDeadline') {
                const { assignmentId, currentDeadline } = modalData;
                const title = "ขยายเวลาส่งงาน";
                const content = `
                    <form id="extend-deadline-form" data-assignment-id="${assignmentId}">
                        <label class="block mb-2">กำหนดเวลาใหม่:</label>
                        <input id="new-deadline" type="datetime-local" value="${currentDeadline || ''}" class="w-full p-2 border rounded-md" required>
                        <button type="submit" class="w-full bg-yellow-500 text-white p-2 rounded-md hover:bg-yellow-600 mt-4">บันทึก</button>
                    </form>
                `;
                return modalWrapper(title, content);
            }
            
            if (currentModal === 'showMessage') {
                const { message, type } = modalData;
                const title = type === 'success' ? 'สำเร็จ' : (type === 'error' ? 'เกิดข้อผิดพลาด' : 'ข้อความ');
                const color = type === 'success' ? 'text-green-700' : (type === 'error' ? 'text-red-700' : 'text-gray-700');
                const content = `<p class="${color}">${message}</p>
                    <button onclick="window.closeModal()" class="w-full bg-gray-300 text-gray-800 p-2 rounded-md hover:bg-gray-400 mt-4">ปิด</button>
                `;
                return modalWrapper(title, content);
            }

            if (currentModal === 'gradeSubmission') {
                const { submission } = modalData;
                const assignment = assignments.find(a => a.id === submission.assignmentId);

        // --- START: แก้ไขตรรกะการลงทะเบียน ---
        async function handleRegister() {
            const studentId = document.getElementById('register-student-id').value.trim();
            // ลบ firstName, lastName
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            
            if (!studentId || !email || !password) { // อัปเดตเงื่อนไข
                window.showMessage('กรุณากรอกข้อมูลให้ครบทุกช่อง (รหัสประจำตัว, Email, Password)', 'error');
                return;
            }
            
            // ค้นหาด้วยรหัสประจำตัวอย่างเดียว
            const q = query(collection(db, rosterPath()), 
                where("studentId", "==", studentId)
            );
            
            try {
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    window.showMessage('ลงทะเบียนไม่สำเร็จ: รหัสประจำตัวนักเรียน ไม่ถูกต้อง หรือไม่มีในรายชื่อที่ครูอนุญาต', 'error'); // อัปเดตข้อความ
                    return;
                }
                
                const rosterDoc = querySnapshot.docs[0];
                const rosterData = rosterDoc.data();
                
                if (rosterData.isRegistered) {
                    window.showMessage('ลงทะเบียนไม่สำเร็จ: รหัสประจำตัวนักเรียนนี้ถูกลงทะเบียนใช้งานไปแล้ว', 'error');
                    return;
                }

                if (!rosterData.classroomId) {
                     window.showMessage('ลงทะเบียนไม่สำเร็จ: ครูยังไม่ได้กำหนดห้องเรียนให้คุณ กรุณาติดต่อครู', 'error');
                    return;
                }
                
                // ดึงชื่อ-นามสกุล จาก Roster
                const { firstName, lastName } = rosterData;

                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // สร้างโปรไฟล์ผู้ใช้โดยดึงชื่อจาก Roster
                const userDocRef = doc(db, usersPath(), user.uid);
                await setDoc(userDocRef, {
                    email: user.email,
                    firstName: firstName, // <-- ดึงจาก Roster
                    lastName: lastName,   // <-- ดึงจาก Roster
                    studentId: studentId,
                    classroomId: rosterData.classroomId, 
                    status: 'student', 
                    registeredAt: Timestamp.now()
                });
                
                // อัปเดต Roster ว่าลงทะเบียนแล้ว
                const rosterDocRef = doc(db, rosterPath(), rosterDoc.id);
                await updateDoc(rosterDocRef, {
                    isRegistered: true,
                    registeredEmail: user.email,
                    registeredUserId: user.uid
                });
                
            } catch (error) {
                console.error("Register error:", error);
                window.showMessage(`ลงทะเบียนไม่สำเร็จ: ${error.message}`, 'error');
            }
        }

        async function handleEditRoster(e) {
            e.preventDefault();
            const rosterId = e.target.dataset.rosterId;
            const classroomId = document.getElementById('edit-roster-classroom').value;
            const studentId = document.getElementById('edit-roster-student-id').value.trim();
            const firstName = document.getElementById('edit-roster-firstname').value.trim();
            const lastName = document.getElementById('edit-roster-lastname').value.trim();

            if (!classroomId || !studentId || !firstName || !lastName) {
                window.showMessage('กรุณากรอกข้อมูลให้ครบ', 'error');
                return;
            }
            
            const rosterItem = roster.find(r => r.id === rosterId);
            if (!rosterItem) return;

            if (rosterItem.studentId !== studentId) {
                const q = query(collection(db, rosterPath()), where("studentId", "==", studentId));
                const querySnapshot = await getDocs(q);
                if (!querySnapshot.empty) {
                    window.showMessage('รหัสประจำตัวนักเรียนใหม่นี้ มีอยู่แล้วในระบบ', 'error');
                    return;
                }
            }
            
            const docRef = doc(db, rosterPath(), rosterId);
            try {
                await updateDoc(docRef, {
                    classroomId: classroomId,
                    studentId: studentId,
                    firstName: firstName,
                    lastName: lastName
                });

                if (rosterItem.isRegistered && rosterItem.registeredUserId) {
                    const userDocRef = doc(db, usersPath(), rosterItem.registeredUserId);
                    await updateDoc(userDocRef, {
                        classroomId: classroomId,
                        studentId: studentId,
                        firstName: firstName,
                        lastName: lastName
                    });
                    console.log(`Updated user profile ${rosterItem.registeredUserId} as well.`);
                }

                window.closeModal();
                window.showMessage('แก้ไขข้อมูลนักเรียนเรียบร้อย', 'success');
            } catch (error) {
                console.error("Error editing roster item:", error);
                window.showMessage(`เกิดข้อผิดพลาด: ${error.message}`, 'error');
            }
        }

        async function handleCreateAssignment() {
            const classroomId = document.getElementById('assignment-classroom').value;
            const chapter = document.getElementById('assignment-chapter').value;
            const title = document.getElementById('assignment-title').value;
            const deadlineString = document.getElementById('assignment-deadline').value;
            const maxScore = document.getElementById('assignment-max-score').value;
            
            if (!classroomId || !title || !deadlineString || !maxScore) {
                window.showMessage('กรุณาเลือกห้อง, กรอกชื่องาน, กำหนดเวลา และคะแนนเต็ม', 'error');
                return;
            }
            
            try {
                const deadline = Timestamp.fromDate(new Date(deadlineString));
                await addDoc(collection(db, assignmentsPath()), {
                    classroomId: classroomId,
                    chapter: chapter || 'ทั่วไป',
                    title,
                    deadline,
                    maxScore: parseInt(maxScore, 10),
                    createdAt: Timestamp.now(),
                    createdBy: currentUserAuth.email
                });
                window.showMessage('สร้างงานเรียบร้อยแล้ว', 'success');
                document.getElementById('create-assignment-form').reset();
            } catch (error) {
                console.error("Error creating assignment: ", error);
                window.showMessage(`เกิดข้อผิดพลาด: ${error.message}`, 'error');
            }
        }

        window.showEditAssignmentModal = (assignmentId) => {
            const assignment = assignments.find(a => a.id === assignmentId);
            if (!assignment) {
                window.showMessage('ไม่พบข้อมูลงาน', 'error');
                return;
            }
            currentModal = 'editAssignment';
            modalData = { assignment };
            render();
        }

        async function handleEditAssignment(e) {
            e.preventDefault();
            const assignmentId = e.target.dataset.assignmentId;
            const classroomId = document.getElementById('edit-assignment-classroom').value;
            const chapter = document.getElementById('edit-assignment-chapter').value;
            const title = document.getElementById('edit-assignment-title').value;
            const deadlineString = document.getElementById('edit-assignment-deadline').value;
            const maxScore = document.getElementById('edit-assignment-max-score').value;

            if (!classroomId || !title || !deadlineString || !maxScore) {
                window.showMessage('กรุณากรอกข้อมูลให้ครบ', 'error');
                return;
            }

            const docRef = doc(db, assignmentsPath(), assignmentId);
            try {
                const deadline = Timestamp.fromDate(new Date(deadlineString));
                await updateDoc(docRef, {
                    classroomId: classroomId,
                    chapter: chapter || 'ทั่วไป',
                    title: title,
                    deadline: deadline,
                    maxScore: parseInt(maxScore, 10)
                });
                window.closeModal();
                window.showMessage('แก้ไขงานเรียบร้อย', 'success');
            } catch (error) {
                console.error("Error editing assignment:", error);
                window.showMessage(`เกิดข้อผิดพลาด: ${error.message}`, 'error');
            }
        }
        
        window.handleDelete = async (collectionName, docId) => {
            try {
                let path;
                if (collectionName === 'documents') path = documentsPath();
                if (collectionName === 'assignments') path = assignmentsPath();
                if (collectionName === 'roster') path = rosterPath();
                if (collectionName === 'classrooms') path = classroomsPath(); 
                
                if(!path) throw new Error("Invalid collection name");

                await deleteDoc(doc(db, path, docId));
                window.showMessage('ลบข้อมูลเรียบร้อยแล้ว', 'success');
            } catch (error) {
                console.error("Error deleting document: ", error);
                window.showMessage(`เกิดข้อผิดพลาด: ${error.message}`, 'error');
            }
        }
        
        window.showViewDownloaders = (docId) => {
            currentModal = 'viewDownloaders';
            modalData = { docId };
            render(); 
            
            const container = document.getElementById('downloader-list-container');
            const q = query(collection(db, downloadLogsPath()), where("documentId", "==", docId));
            
            const unsubscribe = onSnapshot(q, (snapshot) => {
                if (snapshot.empty) {
                    container.innerHTML = '<p class="text-gray-500">ยังไม่มีผู้ดาวน์โหลด</p>';
                    return;
                }
                const logs = snapshot.docs.map(doc => doc.data());
                logs.sort((a, b) => (b.timestamp?.toMillis() || 0) - (a.timestamp?.toMillis() || 0));
                container.innerHTML = `
                    <ul class="space-y-2">
                        ${logs.map(log => `
                            <li class="flex justify-between items-center p-2 bg-gray-100 rounded-md">
                                <span class="font-semibold">${log.userName || log.userEmail || 'N/A'}</span>
                                <span class="text-sm text-gray-600">${formatTimestamp(log.timestamp)}</span>
                            </li>
                        `).join('')}
                    </ul>`;
            }, (error) => {
                console.error("Error fetching download logs:", error);
                container.innerHTML = `<p class="text-red-500">ไม่สามารถโหลดข้อมูลได้</p>`;
            });
            listeners.push({id: 'modal-listener', fn: unsubscribe}); 
        }
        
        window.showViewSubmissions = (assignmentId) => {
            currentModal = 'viewSubmissions';
            modalData = { assignmentId };
            render(); 

            const container = document.getElementById('submission-list-container');
            const q = query(collection(db, submissionsPath()), where("assignmentId", "==", assignmentId));
            
            const unsubscribe = onSnapshot(q, (snapshot) => {
                if (snapshot.empty) {
                    container.innerHTML = '<p class="text-gray-500">ยังไม่มีผู้ส่งงาน</p>';
                    return;
                }
                const subs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                subs.sort((a, b) => (b.timestamp?.toMillis() || 0) - (a.timestamp?.toMillis() || 0));
                container.innerHTML = `
                    <ul class="space-y-2">
                        ${subs.map(sub => `
                            <li class="flex flex-col sm:flex-row justify-between sm:items-center p-2 ${sub.isChecked ? 'bg-green-100' : 'bg-gray-100'} rounded-md transition-colors">
                                <div class="mb-1 sm:mb-0">
                                    <span class="font-semibold">${sub.userName || sub.userEmail || 'N/A'}</span>
                                    <p class="text-sm text-gray-500 truncate max-w-xs" title="${sub.fileUrl || sub.fileName}">
                                        ลิงก์: <a href="${sub.fileUrl}" target="_blank" class="text-blue-500 hover:underline">เปิดงาน</a>
                                    </p>
                                </div>
                                <div class="flex items-center space-x-2 mt-1 sm:mt-0">
                                    <span class="text-sm text-gray-600">${formatTimestamp(sub.timestamp)}</span>
                                    ${sub.isChecked 
                                        ? `<button onclick="window.showGradeModal('${sub.id}')" class="text-sm bg-yellow-500 text-white px-2 py-1 rounded-md hover:bg-yellow-600 transition-opacity">แก้ไขคะแนน</button>`
                                        : `<button onclick="window.showGradeModal('${sub.id}')" class="text-sm bg-green-500 text-white px-2 py-1 rounded-md hover:bg-green-600 transition-opacity">ให้คะแนน</button>`
                                    }
                                </div>
                            </li>
                        `).join('')}
                    </ul>`;
            }, (error) => {
                console.error("Error fetching submissions:", error);
                container.innerHTML = `<p class="text-red-500">ไม่สามารถโหลดข้อมูลได้</p>`;
            });
            listeners.push({id: 'modal-listener', fn: unsubscribe}); 
        }
        
        window.showExtendDeadline = (assignmentId) => {
            const assignment = assignments.find(a => a.id === assignmentId);
            if (!assignment) {
                window.showMessage('ไม่พบงานที่ต้องการ', 'error');
                return;
            }
            const currentDeadline = assignment.deadline ? 
                new Date(assignment.deadline.toMillis() - (new Date().getTimezoneOffset() * 60000))
                .toISOString().slice(0, 16) 
                : '';
            currentModal = 'extendDeadline';
            modalData = { assignmentId, currentDeadline };
            render();
        }

        window.showGradeModal = (submissionId) => {
            const submission = allSubmissions.find(s => s.id === submissionId); 
            if (!submission) {
                window.showMessage('ไม่พบข้อมูลการส่งงาน', 'error');
                return;
            }
            currentModal = 'gradeSubmission';
            modalData = { submission };
            render();
        }

        async function handleSaveGrade(e) {
            e.preventDefault();
            const submissionId = e.target.dataset.submissionId;
            const score = document.getElementById('grade-score').value;
            const comment = document.getElementById('grade-comment').value;
            
            const docRef = doc(db, submissionsPath(), submissionId);
            try {
                await updateDoc(docRef, {
                    score: score === '' ? null : parseInt(score, 10),
                    teacherComment: comment,
                    isChecked: true, 
                    checkedAt: Timestamp.now()
                });
                window.closeModal();
                window.showMessage('บันทึกคะแนนเรียบร้อย', 'success');
            } catch (error) {
                console.error("Error saving grade:", error);
                window.showMessage(`เกิดข้อผิดพลาด: ${error.message}`, 'error');
            }
        }

        async function toggleCheckSubmission(submissionId, currentStatus, fromModal = false) {
            if (!db || !submissionId) return;
            if (currentStatus === false) return; 

            const docRef = doc(db, submissionsPath(), submissionId);
            try {
                await updateDoc(docRef, {
                    isChecked: false,
                    score: null,
                    teacherComment: "",
                    checkedAt: null
                });
                if (fromModal) {
                    window.closeModal();
                    window.showMessage('ยกเลิกการตรวจแล้ว', 'success');
                }
            } catch (error) {
                console.error("Error toggling check status:", error);
                window.showMessage('เกิดข้อผิดพลาดในการอัปเดตสถานะ', 'error');
            }
        }
        
        function renderGradebook() {
            const students = allUsers.filter(u => u.status === 'student');
            const sortedAssignments = [...assignments].sort((a, b) => (a.createdAt?.toMillis() || 0) - (b.createdAt?.toMillis() || 0));

            const getScore = (studentId, assignmentId) => {
                const sub = allSubmissions.find(s => s.userId === studentId && s.assignmentId === assignmentId);
                return sub && sub.isChecked ? sub.score : '-';
            };
            
            const getTotalScore = (studentId) => {
                let total = 0;
                let hasScore = false;
                allSubmissions.forEach(sub => {
                    if (sub.userId === studentId && sub.isChecked && typeof sub.score === 'number') {
                        total += sub.score;
                        hasScore = true;
                    }
                });
                return hasScore ? total : '-';
            };
            
            const getMaxTotal = () => {
                return sortedAssignments.reduce((total, assign) => {
                    return total + (assign.maxScore || 0);
                }, 0);
            };

            return `
                <div class="bg-white p-6 rounded-lg shadow-lg">
                    <div class="flex justify-between items-center mb-4 border-b pb-2">
                        <h2 class="text-2xl font-semibold">สรุปคะแนน (Gradebook)</h2>
                        <button onclick="window.exportGradebookToCSV()" class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 text-sm">
                            Export to CSV
                        </button>
                    </div>
                    
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200 border">
                            <thead class="bg-gray-100">
                                <tr>
                                    <th class="p-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider border-r">นักเรียน (ห้อง)</th>
                                    ${sortedAssignments.map(assign => `
                                        <th class="p-3 text-center text-xs font-semibold text-gray-600 uppercase tracking-wider border-r">
                                            ${assign.title}<br>
                                            <span class="font-normal">(เต็ม ${assign.maxScore || 'N/A'})</span>
                                        </th>
                                    `).join('')}
                                    <th class="p-3 text-center text-xs font-semibold text-gray-600 uppercase tracking-wider bg-gray-200">
                                        รวม<br>
                                        <span class="font-normal">(เต็ม ${getMaxTotal()})</span>
                                    </th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                                ${students.length === 0 
                                    ? `<tr><td colspan="${sortedAssignments.length + 2}" class="p-4 text-center text-gray-500">ยังไม่มีนักเรียน</td></tr>`
                                    : students.map(student => {
                                        const classroom = classrooms.find(c => c.id === student.classroomId);
                                        return `
                                    <tr class="hover:bg-gray-50">
                                    <td class="p-3 whitespace-nowrap text-sm font-medium text-gray-800 border-r">
                                        ${student.firstName || ''} ${student.lastName || ''}
                                        <span class="text-xs text-gray-500">(${classroom?.name || 'N/A'})</span>
                                    </td>
                                    ${sortedAssignments.map(assign => `
                                        <td class="p-3 whitespace-nowrap text-sm text-gray-600 text-center border-r">
                                            ${getScore(student.id, assign.id)}
                                            </td>
                                        `).join('')}
                                        <td class="p-3 whitespace-nowrap text-sm font-bold text-gray-800 text-center bg-gray-100">
                                            ${getTotalScore(student.id)}
                                        </td>
                                    </tr>
                                `}).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }
        
        window.exportGradebookToCSV = () => {
            const students = allUsers.filter(u => u.status === 'student');
            const sortedAssignments = [...assignments].sort((a, b) => (a.createdAt?.toMillis() || 0) - (b.createdAt?.toMillis() || 0));

            const getScore = (studentId, assignmentId) => {
                const sub = allSubmissions.find(s => s.userId === studentId && s.assignmentId === assignmentId);
                return sub && sub.isChecked ? sub.score : ''; 
            };
            
            const getTotalScore = (studentId) => {
                let total = 0;
                let hasScore = false;
                allSubmissions.forEach(sub => {
                    if (sub.userId === studentId && sub.isChecked && typeof sub.score === 'number') {
                        total += sub.score;
                        hasScore = true;
                    }
                });
                return hasScore ? total : '';
            };
            
            const getMaxTotal = () => {
                return sortedAssignments.reduce((total, assign) => {
                    return total + (assign.maxScore || 0);
                }, 0);
            };

            let csvContent = "data:text/csv;charset=utf-8,";

            let header = ["Student ID", "Student Name", "Student Email", "Classroom"];
            sortedAssignments.forEach(assign => {
                header.push(`"${assign.title} (Max: ${assign.maxScore || 'N/A'})"`);
            });
            header.push(`"Total (Max: ${getMaxTotal()})"`);
            csvContent += header.join(",") + "\r\n";

            students.forEach(student => {
                const classroom = classrooms.find(c => c.id === student.classroomId);
                let row = [
                    `"${student.studentId || 'N/A'}"`,
                    `"${student.firstName || ''} ${student.lastName || ''}"`, 
                    `"${student.email}"`,
                    `"${classroom?.name || 'N/A'}"`
                ];
                sortedAssignments.forEach(assign => {
                    row.push(`"${getScore(student.id, assign.id)}"`);
                });
                row.push(`"${getTotalScore(student.id)}"`);
                csvContent += row.join(",") + "\r\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `gradebook_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function handleExtendDeadline(e) {
            e.preventDefault();
            const assignmentId = e.target.dataset.assignmentId;
            const newDeadlineString = document.getElementById('new-deadline').value;
            
            try {
                const newDeadline = Timestamp.fromDate(new Date(newDeadlineString));
                const docRef = doc(db, assignmentsPath(), assignmentId);
                await updateDoc(docRef, { deadline: newDeadline });
                window.closeModal();
                window.showMessage('ขยายเวลาเรียบร้อยแล้ว', 'success');
            } catch (error) {
                console.error("Error extending deadline: ", error);
                window.showMessage(`เกิดข้อผิดพลาด: ${error.message}`, 'error');
            }
        }
        
        // --- STUDENT ACTIONS ---
        
        window.showDownloadPrompt = (docId, fileUrl) => {
            if (!fileUrl || fileUrl === 'undefined') {
                window.showMessage('ขออภัย, ไม่พบ URL ของไฟล์นี้', 'error');
                return;
            }
            currentModal = 'downloadPrompt';
            modalData = { docId, fileUrl };
            render();
        };

        async function handleDownloadLog(e) {
            e.preventDefault();
            const docId = e.target.dataset.docId;
            const fileUrl = e.target.dataset.fileUrl;
            
            if (!currentUserAuth) {
                window.showMessage('กรุณาเข้าสู่ระบบก่อน', 'error');
                return;
            }
            
            try {
                await addDoc(collection(db, downloadLogsPath()), {
                    documentId: docId,
                    userId: currentUserAuth.uid,
                    userEmail: currentUserAuth.email,
                    userName: `${currentUserProfile?.firstName || ''} ${currentUserProfile?.lastName || ''}`,
                    timestamp: Timestamp.now()
                });
                
                window.closeModal();
                window.showMessage('บันทึกข้อมูลเรียบร้อย! การดาวน์โหลดจะเริ่มขึ้น...', 'success');
                window.open(fileUrl, '_blank');
                
            } catch (error) {
                console.error("Error logging download: ", error);
                window.showMessage(`เกิดข้อผิดพลาด: ${error.message}`, 'error');
            }
        }
        
        window.showSubmitPrompt = (assignmentId) => {
            const assignment = assignments.find(a => a.id === assignmentId);
            if (!assignment) return;
            
            if (Date.now() > (assignment.deadline?.toMillis() || 0)) {
                window.showMessage('หมดเวลาส่งงานแล้ว', 'error');
                return;
            }
            if (mySubmissions.some(s => s.assignmentId === assignmentId)) {
                window.showMessage('คุณได้ส่งงานนี้ไปแล้ว', 'error');
                window.closeModal();
                return;
            }
            
            currentModal = 'submitPrompt';
            modalData = { assignmentId };
            render();
        }
        
        async function handleSubmitWork(e) {
            e.preventDefault();
            const assignmentId = e.target.dataset.assignmentId;
            const urlInput = document.getElementById('submission-url');
            
            if (!urlInput || !urlInput.value) {
                window.showMessage('กรุณาป้อน URL ของงาน', 'error');
                return;
            }

            const fileUrl = urlInput.value;
            
            try {
                await addDoc(collection(db, submissionsPath()), {
                    assignmentId,
                    userId: currentUserAuth.uid,
                    userEmail: currentUserAuth.email,
                    userName: `${currentUserProfile?.firstName || ''} ${currentUserProfile?.lastName || ''}`,
                    classroomId: currentUserProfile?.classroomId || null, 
                    fileUrl: fileUrl,
                    fileName: '',
                    timestamp: Timestamp.now(),
                    isChecked: false,
                    score: null,
                    teacherComment: ""
                });
                
                window.closeModal();
                window.showMessage('ส่งงานเรียบร้อยแล้ว!', 'success');
                
            } catch (error) {
                console.error("Error submitting work: ", error);
                window.showMessage(`เกิดข้อผิดพลาด: ${error.message}`, 'error');
            }
        }
        
        // --- UTILITY ---
        
        function formatTimestamp(fsTimestamp) {
            if (!fsTimestamp) return 'N/A';
            return fsTimestamp.toDate().toLocaleString('th-TH', {
                dateStyle: 'short',
                timeStyle: 'short'
            });
        }
        
        // --- Attach Functions to Window ---
        window.showViewDownloaders = showViewDownloaders;
        window.handleDelete = handleDelete;
        window.showViewSubmissions = showViewSubmissions;
        window.showExtendDeadline = showExtendDeadline;
        window.showDownloadPrompt = showDownloadPrompt;
        window.showSubmitPrompt = showSubmitPrompt;
        window.toggleCheckSubmission = toggleCheckSubmission;
        window.handleLogout = handleLogout;
        window.switchToLogin = switchToLogin;
        window.switchToRegister = switchToRegister;
        window.updateUserRole = updateUserRole;
        window.handleForgotPassword = handleForgotPassword;
        window.setTeacherView = setTeacherView;
        window.setStudentView = setStudentView;
        window.showGradeModal = showGradeModal;
        window.exportGradebookToCSV = exportGradebookToCSV;
        window.handleAddClassroom = handleAddClassroom;
        window.showEditRosterModal = showEditRosterModal;
        window.showEditAssignmentModal = showEditAssignmentModal;

    </script>
