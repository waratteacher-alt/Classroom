<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบห้องเรียนออนไลน์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6;
        }

        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.5);
        }

        .sidebar-icon {
            transition: all 0.3s ease;
        }

        .sidebar-icon:hover {
            background-color: #4f46e5;
            color: #ffffff;
        }

        .sidebar-item {
            transition: all 0.2s ease;
        }

        .sidebar-item.active {
            background-color: #eef2ff;
            color: #4f46e5;
            font-weight: 600;
            border-right: 4px solid #4f46e5;
        }

        .sidebar-item:hover {
            background-color: #f9fafb;
        }

        .btn {
            @apply py-2 px-4 rounded-lg font-semibold shadow-sm transition-all duration-200;
        }

        .btn-primary {
            @apply bg-indigo-600 text-white hover:bg-indigo-700;
        }

        .btn-secondary {
            @apply bg-gray-200 text-gray-800 hover:bg-gray-300;
        }

        .btn-danger {
            @apply bg-red-600 text-white hover:bg-red-700;
        }
        
        .btn-success {
            @apply bg-green-600 text-white hover:bg-green-700;
        }

        .badge {
            @apply px-2 py-0.5 rounded-full text-xs font-medium;
        }

        .badge-pending {
            @apply bg-yellow-100 text-yellow-800;
        }

        .badge-student {
            @apply bg-blue-100 text-blue-800;
        }

        .badge-teacher {
            @apply bg-indigo-100 text-indigo-800;
        }
        
        .badge-unregistered {
            @apply bg-gray-100 text-gray-800;
        }

        .badge-registered {
            @apply bg-green-100 text-green-800;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="url"],
        input[type="number"],
        input[type="date"] {
            @apply w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500;
        }
    </style>
</head>

<body class="flex h-screen">

    <!-- Loading Spinner -->
    <div id="loading" class="fixed inset-0 bg-white bg-opacity-75 flex items-center justify-center z-50">
        <i class="fas fa-spinner fa-spin fa-3x text-indigo-600"></i>
    </div>

    <!-- Main Content Area -->
    <div id="app" class="flex-1 flex flex-col h-screen overflow-hidden">
        <!-- App content will be rendered here -->
    </div>

    <!-- Modals (Pop-ups) -->
    <div id="modal-container"></div>


    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import {
            getAuth,
            signInAnonymously,
            signInWithCustomToken,
            onAuthStateChanged,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signOut
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import {
            getFirestore,
            doc,
            getDoc,
            addDoc,
            setDoc,
            updateDoc,
            deleteDoc,
            onSnapshot,
            collection,
            query,
            where,
            getDocs,
            Timestamp,
            writeBatch,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import {
            getStorage,
            ref,
            uploadBytes,
            getDownloadURL,
            deleteObject
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        // --- GLOBAL STATE ---
        let app, db, auth, storage;
        let currentUserAuth = null; // Firebase Auth object (null if logged out)
        let currentUserData = null; // Firestore user data (status, name, etc.)
        
        let usersList = []; // Local cache for all users
        let documentsList = []; // Local cache for documents
        let assignmentsList = []; // Local cache for assignments
        let submissionsList = []; // Local cache for submissions
        let studentRoster = []; // Local cache for student roster

        // Listeners (for cleanup)
        let cleanupListeners = [];

        // UI State
        let currentModal = null; // 'login', 'register', 'uploadDoc', 'createAssignment', etc.
        let currentTeacherView = 'manageUsers'; // Default teacher view
        let currentStudentView = 'downloadDocs'; // Default student view
        let isLoading = true;

        // --- CONFIG ---
        // DO NOT EDIT __app_id OR __firebase_config manually
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'classroom-2f761';
        const firebaseConfigStr = typeof __firebase_config !== 'undefined' ?
            __firebase_config :
            JSON.stringify({
                apiKey: "AIzaSyCqax0IdvYgaU3pQyAjYKad2WAfc0l0tpI",
                authDomain: "classroom-2f761.firebaseapp.com",
                projectId: "classroom-2f761",
                storageBucket: "classroom-2f761.firebasestorage.app",
                messagingSenderId: "1000272941555",
                appId: "1:1000272941555:web:07672098f97067db160286",
                measurementId: "G-VMMVKXN6W2"
            });
        
        const firebaseConfig = JSON.parse(firebaseConfigStr);

        // --- COLLECTIONS ---
        const getCollectionPath = (collectionName) => `artifacts/${appId}/public/data/${collectionName}`;
        const usersCol = () => collection(db, getCollectionPath('users'));
        const docsCol = () => collection(db, getCollectionPath('documents'));
        const assignmentsCol = () => collection(db, getCollectionPath('assignments'));
        const submissionsCol = () => collection(db, getCollectionPath('submissions'));
        const downloadsCol = () => collection(db, getCollectionPath('downloads'));
        const rosterCol = () => collection(db, getCollectionPath('roster')); // For student roster

        // --- INITIALIZATION ---
        window.onload = async () => {
            try {
                console.log("App initializing...");
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                storage = getStorage(app);

                // Set log level for debugging
                // setLogLevel('debug');

                // --- Auth State Listener ---
                // This is the main controller for the app.
                // It fires when the app loads and whenever the login state changes.
                onAuthStateChanged(auth, async (user) => {
                    console.log("Auth state changed. User:", user ? user.uid : 'Logged out');
                    
                    // Clean up old data listeners to prevent memory leaks
                    cleanupAllListeners();
                    
                    if (user) {
                        currentUserAuth = user;
                        // Fetch user data from Firestore
                        const userDocRef = doc(db, getCollectionPath('users'), user.uid);
                        const userDocSnap = await getDoc(userDocRef);

                        if (userDocSnap.exists()) {
                            currentUserData = { uid: user.uid, ...userDocSnap.data() };
                            console.log("User data found:", currentUserData.status);
                            
                            // Attach data listeners based on user role
                            attachDataListeners(currentUserData.status);
                            
                            // Render the correct UI
                            renderApp();
                        } else {
                            // This shouldn't happen with the new register flow, but good to have
                            console.error("User document not found in Firestore!");
                            currentUserData = null; // No data, treat as pending
                            renderApp();
                        }
                    } else {
                        // User is logged out
                        currentUserAuth = null;
                        currentUserData = null;
                        renderApp(); // Render the login screen
                    }
                    setLoading(false);
                });

            } catch (error) {
                console.error("Firebase Init Error:", error);
                document.getElementById('app').innerHTML = `<div class="p-4 text-red-700 bg-red-100 rounded">เกิดข้อผิดพลาดในการเชื่อมต่อ: ${error.message}</div>`;
                setLoading(false);
            }

            // Attach window functions (must be done last)
            attachWindowFunctions();
        };

        // --- DATA LISTENERS ---

        function cleanupAllListeners() {
            console.log(`Cleaning up ${cleanupListeners.length} old listeners...`);
            cleanupListeners.forEach(unsubscribe => unsubscribe());
            cleanupListeners = [];
        }

        function attachDataListeners(status) {
            console.log(`Attaching listeners for status: ${status}`);
            
            // All authenticated users can see documents and assignments
            const docsQuery = query(docsCol());
            const docsUnsub = onSnapshot(docsQuery, (snapshot) => {
                documentsList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderApp(); // Re-render app with new data
            }, (err) => console.error("Docs listener error:", err));
            cleanupListeners.push(docsUnsub);

            const assignmentsQuery = query(assignmentsCol());
            const assignmentsUnsub = onSnapshot(assignmentsQuery, (snapshot) => {
                assignmentsList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderApp();
            }, (err) => console.error("Assignments listener error:", err));
            cleanupListeners.push(assignmentsUnsub);

            // Teachers get extra data
            if (status === 'teacher') {
                // Listen for all users
                const usersQuery = query(usersCol());
                const usersUnsub = onSnapshot(usersQuery, (snapshot) => {
                    usersList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    renderApp();
                }, (err) => console.error("Users listener error:", err));
                cleanupListeners.push(usersUnsub);

                // Listen for all submissions
                const submissionsQuery = query(submissionsCol());
                const subsUnsub = onSnapshot(submissionsQuery, (snapshot) => {
                    submissionsList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    renderApp();
                }, (err) => console.error("Submissions listener error:", err));
                cleanupListeners.push(subsUnsub);

                // Listen for student roster
                const rosterQuery = query(rosterCol());
                const rosterUnsub = onSnapshot(rosterQuery, (snapshot) => {
                    studentRoster = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    renderApp();
                }, (err) => console.error("Roster listener error:", err));
                cleanupListeners.push(rosterUnsub);
            }
            
            // Students get their own submissions
            if (status === 'student') {
                const studentSubsQuery = query(submissionsCol(), where("studentId", "==", currentUserAuth.uid));
                const studentSubsUnsub = onSnapshot(studentSubsQuery, (snapshot) => {
                    submissionsList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    renderApp();
                }, (err) => console.error("Student submissions listener error:", err));
                cleanupListeners.push(studentSubsUnsub);
            }
        }


        // --- UI RENDERING ---

        function setLoading(state) {
            isLoading = state;
            const loader = document.getElementById('loading');
            if (loader) {
                loader.style.display = state ? 'flex' : 'none';
            }
        }

        // Main App Renderer
        function renderApp() {
            if (isLoading) return; // Don't render if still loading
            
            const appDiv = document.getElementById('app');
            if (!appDiv) return;

            if (!currentUserAuth) {
                // Not logged in
                appDiv.innerHTML = renderLoginRegister();
            } else if (!currentUserData || currentUserData.status === 'pending') {
                // Logged in, but pending approval
                appDiv.innerHTML = renderPendingView();
            } else if (currentUserData.status === 'teacher') {
                // Logged in as Teacher
                appDiv.innerHTML = renderTeacherView();
            } else if (currentUserData.status === 'student') {
                // Logged in as Student
                appDiv.innerHTML = renderStudentView();
            }
            
            // Always render modals (they are hidden by default)
            renderModals();
        }

        // --- AUTH & LOGIN VIEWS ---

        function renderLoginRegister() {
            // Show Login by default
            return `
                <div class="flex items-center justify-center min-h-screen bg-gray-100">
                    <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-lg shadow-lg">
                        ${currentModal === 'register' ? renderRegisterForm() : renderLoginForm()}
                    </div>
                </div>
            `;
        }
        
        function renderLoginForm() {
            return `
                <div>
                    <h2 class="text-3xl font-bold text-center text-gray-900">เข้าสู่ระบบ</h2>
                    <p class="mt-2 text-center text-sm text-gray-600">
                        กรุณาเข้าสู่ระบบเพื่อใช้งาน
                    </p>
                </div>
                <form class="mt-8 space-y-6" onsubmit="handleLogin(event)">
                    <div id="login-error" class="hidden p-3 text-red-700 bg-red-100 rounded-md"></div>
                    <div>
                        <label for="login-email" class="sr-only">Email</label>
                        <input id="login-email" name="email" type="email" required placeholder="Email" autocomplete="email">
                    </div>
                    <div>
                        <label for="login-password" class="sr-only">รหัสผ่าน</label>
                        <input id="login-password" name="password" type="password" required placeholder="รหัสผ่าน" autocomplete="current-password">
                    </div>
                    <div>
                        <button type="submit" class="btn btn-primary w-full">
                            เข้าสู่ระบบ
                        </button>
                    </div>
                </form>
                <p class="mt-4 text-center text-sm text-gray-600">
                    ยังไม่มีบัญชี?
                    <button onclick="setModal('register')" class="font-medium text-indigo-600 hover:text-indigo-500">
                        ลงทะเบียนที่นี่
                    </button>
                </p>
            `;
        }

        function renderRegisterForm() {
            return `
                <div>
                    <h2 class="text-3xl font-bold text-center text-gray-900">ลงทะเบียน</h2>
                    <p class="mt-2 text-center text-sm text-gray-600">
                        เฉพาะผู้ที่ครูอนุญาตไว้เท่านั้น
                    </p>
                </div>
                <form class="mt-8 space-y-4" onsubmit="handleRegister(event)">
                    <div id="register-error" class="hidden p-3 text-red-700 bg-red-100 rounded-md"></div>
                    
                    <div>
                        <label for="register-student-id" class="block text-sm font-medium text-gray-700">รหัสประจำตัวนักเรียน</label>
                        <input id="register-student-id" name="studentId" type="text" required placeholder="เช่น 65001">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label for="register-fname" class="block text-sm font-medium text-gray-700">ชื่อจริง</label>
                            <input id="register-fname" name="fname" type="text" required placeholder="สมชาย">
                        </div>
                        <div>
                            <label for="register-lname" class="block text-sm font-medium text-gray-700">นามสกุล</label>
                            <input id="register-lname" name="lname" type="text" required placeholder="ใจดี">
                        </div>
                    </div>
                     <div>
                        <label for="register-email" class="block text-sm font-medium text-gray-700">Email</label>
                        <input id="register-email" name="email" type="email" required placeholder="Email" autocomplete="email">
                    </div>
                    <div>
                        <label for="register-password" class="block text-sm font-medium text-gray-700">รหัสผ่าน</label>
                        <input id="register-password" name="password" type="password" required placeholder="รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)" autocomplete="new-password">
                    </div>
                    
                    <div>
                        <button type="submit" class="btn btn-primary w-full">
                            ลงทะเบียน
                        </button>
                    </div>
                </form>
                <p class="mt-4 text-center text-sm text-gray-600">
                    มีบัญชีอยู่แล้ว?
                    <button onclick="setModal('login')" class="font-medium text-indigo-600 hover:text-indigo-500">
                        เข้าสู่ระบบที่นี่
                    </button>
                </p>
            `;
        }

        function renderPendingView() {
            return `
                <div class="flex flex-col items-center justify-center min-h-screen bg-gray-100 p-4">
                    <div class="w-full max-w-lg p-8 text-center bg-white rounded-lg shadow-lg">
                        <i class="fas fa-hourglass-half fa-3x text-indigo-600 mb-4"></i>
                        <h2 class="text-2xl font-bold text-gray-900 mb-2">สถานะ: รอการอนุมัติ</h2>
                        <p class="text-gray-600 mb-6">
                            บัญชีของคุณ (${currentUserAuth ? currentUserAuth.email : ''}) ถูกสร้างเรียบร้อยแล้ว<br/>
                            กรุณารอให้คุณครูอนุมัติการเข้าใช้งาน
                        </p>
                        <button onclick="handleLogout()" class="btn btn-danger">
                            ออกจากระบบ
                        </button>
                    </div>
                </div>
            `;
        }

        // --- TEACHER VIEW ---

        function renderTeacherView() {
            return `
                <div class="flex h-full">
                    <!-- Sidebar -->
                    <nav class="w-64 bg-white shadow-lg flex-shrink-0">
                        <div class="flex flex-col h-full">
                            <!-- Header -->
                            <div class="flex items-center justify-between p-4 border-b">
                                <span class="text-xl font-bold text-indigo-600"><i class="fas fa-chalkboard-teacher mr-2"></i>โหมดครู</span>
                            </div>
                            <!-- Menu -->
                            <div class="flex-1 overflow-y-auto">
                                ${renderSidebarItem('manageRoster', 'fas fa-id-card', 'จัดการรายชื่อนักเรียน', currentTeacherView === 'manageRoster')}
                                ${renderSidebarItem('manageUsers', 'fas fa-users-cog', 'จัดการผู้ใช้งาน', currentTeacherView === 'manageUsers')}
                                ${renderSidebarItem('manageDocs', 'fas fa-file-upload', 'จัดการเอกสาร', currentTeacherView === 'manageDocs')}
                                ${renderSidebarItem('manageAssignments', 'fas fa-tasks', 'จัดการงาน', currentTeacherView === 'manageAssignments')}
                                ${renderSidebarItem('gradebook', 'fas fa-book', 'สรุปคะแนน', currentTeacherView === 'gradebook')}
                            </div>
                            <!-- Footer -->
                            <div class="p-4 border-t">
                                <div class="mb-2">
                                    <i class="fas fa-user mr-2 text-gray-500"></i>
                                    <span class="text-sm font-medium">${currentUserData.fname} ${currentUserData.lname}</span>
                                </div>
                                <button onclick="handleLogout()" class="btn btn-danger w-full">
                                    <i class="fas fa-sign-out-alt mr-2"></i>ออกจากระบบ
                                </button>
                            </div>
                        </div>
                    </nav>
                    
                    <!-- Main Content -->
                    <main class="flex-1 bg-gray-100 overflow-y-auto p-8">
                        ${renderTeacherContent()}
                    </main>
                </div>
            `;
        }
        
        function renderSidebarItem(viewName, icon, text, isActive) {
            return `
                <div onclick="setTeacherView('${viewName}')" class="sidebar-item flex items-center p-4 text-gray-700 cursor-pointer ${isActive ? 'active' : 'hover:bg-gray-50'}">
                    <i class="${icon} w-6 text-center ${isActive ? 'text-indigo-600' : 'text-gray-500'}"></i>
                    <span class="ml-3">${text}</span>
                </div>
            `;
        }

        function renderTeacherContent() {
            switch (currentTeacherView) {
                case 'manageRoster':
                    return renderManageRoster();
                case 'manageUsers':
                    return renderManageUsers();
                case 'manageDocs':
                    return renderManageDocs();
                case 'manageAssignments':
                    return renderManageAssignments();
                case 'gradebook':
                    return renderGradebook();
                default:
                    return `<h2>ไม่พบหน้า</h2>`;
            }
        }
        
        // --- Teacher Content: Manage Roster ---
        function renderManageRoster() {
            return `
                <h1 class="text-3xl font-bold text-gray-900 mb-6">จัดการรายชื่อนักเรียน</h1>
                <p class="text-gray-600 mb-6">เพิ่มนักเรียนที่ "อนุญาต" ให้ลงทะเบียนได้ นักเรียนจะต้องกรอก รหัสประจำตัว, ชื่อ, และนามสกุล ให้ตรงกับที่คุณกรอกไว้ จึงจะลงทะเบียนได้</p>
                
                <!-- Add Student Roster Form -->
                <div class="bg-white p-6 rounded-lg shadow-md mb-8">
                    <h2 class="text-2xl font-semibold mb-4">เพิ่มนักเรียนในรายชื่อ</h2>
                    <form onsubmit="handleAddStudentToRoster(event)" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                        <div class="md:col-span-1">
                            <label for="roster-id" class="block text-sm font-medium text-gray-700">รหัสประจำตัวนักเรียน</label>
                            <input id="roster-id" type="text" required placeholder="เช่น 65001">
                        </div>
                        <div class="md:col-span-1">
                            <label for="roster-fname" class="block text-sm font-medium text-gray-700">ชื่อจริง</label>
                            <input id="roster-fname" type="text" required placeholder="สมชาย">
                        </div>
                        <div class="md:col-span-1">
                            <label for="roster-lname" class="block text-sm font-medium text-gray-700">นามสกุล</label>
                            <input id="roster-lname" type="text" required placeholder="ใจดี">
                        </div>
                        <div class="md:col-span-1">
                            <button type="submit" class="btn btn-primary w-full">เพิ่ม</button>
                        </div>
                    </form>
                    <div id="roster-error" class="hidden mt-4 p-3 text-red-700 bg-red-100 rounded-md"></div>
                </div>

                <!-- Roster List -->
                <div class="bg-white rounded-lg shadow-md overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">รหัสประจำตัว</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ชื่อ - นามสกุล</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">สถานะ</th>
                                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            ${studentRoster.sort((a,b) => a.studentId.localeCompare(b.studentId)).map(student => `
                                <tr>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${student.studentId}</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${student.fname} ${student.lname}</td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        ${student.isRegistered ? 
                                            `<span class="badge badge-registered">ลงทะเบียนแล้ว</span>` : 
                                            `<span class="badge badge-unregistered">ยังไม่ลงทะเบียน</span>`
                                        }
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                        ${!student.isRegistered ? 
                                            `<button onclick="handleDeleteRosterStudent('${student.id}')" class="text-red-600 hover:text-red-900">
                                                <i class="fas fa-trash-alt"></i> ลบ
                                            </button>` :
                                            `<span class="text-gray-400 cursor-not-allowed" title="ไม่สามารถลบนักเรียนที่ลงทะเบียนแล้วได้"><i class="fas fa-trash-alt"></i> ลบ</span>`
                                        }
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>

        async function handleLogin(event) {
            event.preventDefault();
            setLoading(true);
            const email = event.target.email.value;
            const password = event.target.password.value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                // Auth listener will handle the rest
            } catch (error) {
                console.error("Login Error:", error.code);
                showLoginError(getAuthErrorMessage(error.code));
                setLoading(false);
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            setLoading(true);

            const studentId = event.target.studentId.value.trim();
            const fname = event.target.fname.value.trim();
            const lname = event.target.lname.value.trim();
            const email = event.target.email.value;
            const password = event.target.password.value;
            
            try {
                // 1. Check if student is in the roster and not already registered
                const q = query(rosterCol(), 
                    where("studentId", "==", studentId), 
                    where("fname", "==", fname), 
                    where("lname", "==", lname)
                );
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    throw new Error("ข้อมูลไม่ถูกต้อง: ไม่พบรหัสประจำตัว, ชื่อ, หรือนามสกุลนี้ในรายชื่อที่ครูอนุญาต");
                }
                
                const rosterDoc = querySnapshot.docs[0];
                if (rosterDoc.data().isRegistered) {
                    throw new Error("รหัสประจำตัวนี้ได้ทำการลงทะเบียนไปแล้ว");
                }

                // 2. Create Auth user
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 3. Create user document in Firestore
                const userDocRef = doc(db, getCollectionPath('users'), user.uid);
                await setDoc(userDocRef, {
                    uid: user.uid,
                    email: user.email,
                    fname: fname,
                    lname: lname,
                    studentId: studentId,
                    status: 'student' // Auto-approve as student
                });
                
                // 4. Update roster document to mark as registered
                const rosterDocRef = doc(db, getCollectionPath('roster'), rosterDoc.id);
                await updateDoc(rosterDocRef, {
                    isRegistered: true,
                    registeredUid: user.uid,
                    registeredEmail: user.email
                });

                // Success! Auth listener will pick up the new user and log them in.
                
            } catch (error) {
                console.error("Register Error:", error.message);
                showRegisterError(getAuthErrorMessage(error.message || error.code));
                setLoading(false);
            }
        }

        async function handleLogout() {
            setLoading(true);
            await signOut(auth);
            // Auth listener will handle the rest and show login screen
            console.log("User logged out.");
        }

            }

        function getAuthErrorMessage(code) {
            switch (code) {
                case 'auth/user-not-found':
                case 'auth/wrong-password':
                    return 'Email หรือ รหัสผ่านไม่ถูกต้อง';
                case 'auth/email-already-in-use':
                    return 'Email นี้ถูกใช้งานแล้ว';
                case 'auth/weak-password':
                    return 'รหัสผ่านสั้นเกินไป (อย่างน้อย 6 ตัวอักษร)';
                case 'auth/invalid-email':
                    return 'รูปแบบ Email ไม่ถูกต้อง';
                default:
                    return code; // Show the raw error message
            }
        }

        async function handleCreateAssignment(event) {
            event.preventDefault();
            setLoading(true);
            
            const title = document.getElementById('assign-title').value;
            const maxScore = parseInt(document.getElementById('assign-score').value, 10);
            const dueDateStr = document.getElementById('assign-due-date').value;

                setLoading(false);
                return;
            }
            
            // Convert local date input to a Firestore Timestamp
            // Input value is YYYY-MM-DD. We parse it as local time (end of day).
            const localDate = new Date(dueDateStr);
            const endOfDay = new Date(localDate.getFullYear(), localDate.getMonth(), localDate.getDate(), 23, 59, 59);
            const dueDateTimestamp = Timestamp.fromDate(endOfDay);

            try {
                await addDoc(assignmentsCol(), {
                    title: title,
                    maxScore: maxScore,
                    dueDate: dueDateTimestamp,
                    createdAt: serverTimestamp(),
                    createdBy: currentUserAuth.uid
                });

                const batch = writeBatch(db);
                
                // 1. Delete the assignment
                const assignRef = doc(db, getCollectionPath('assignments'), assignId);

                // 2. Find and delete all related submissions

                querySnapshot.forEach((doc) => {
                    batch.delete(doc.ref);
                });
                
                await batch.commit();
                showMessage('สำเร็จ', 'ลบงานและการส่งงานทั้งหมดเรียบร้อยแล้ว');

        function exportGradebookToCSV() {
            // Re-build data similarly to renderGradebook
            const students = usersList.filter(u => u.status === 'student').sort((a,b) => a.fname.localeCompare(b.fname));
            const sortedAssignments = [...assignmentsList].sort((a,b) => a.dueDate.toDate() - b.dueDate.toDate());

            let csvContent = "data:text/csv;charset=utf-8,";
            
            // Header Row
            const headerTitles = sortedAssignments.map(a => `"${a.title} (${a.maxScore} คะแนน)"`);
            csvContent += `"รหัสประจำตัว","ชื่อ","นามสกุล",${headerTitles.join(',')}\r\n`;

            // Data Rows
            students.forEach(student => {
                let row = `"${student.studentId}","${student.fname}","${student.lname}"`;
                sortedAssignments.forEach(assign => {
                    const submission = submissionsList.find(s => s.studentId === student.uid && s.assignmentId === assign.id);
                    const score = submission ? (submission.score !== null ? submission.score : 'ส่งแล้ว') : 'ยังไม่ส่ง';
                    row += `,"${score}"`;
                });
                csvContent += row + "\r\n";
            });

            // Create and download link
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "gradebook_export.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }


        // --- STUDENT HANDLERS ---
        
        function showDownloadPrompt(docId, docTitle, docUrl) {
            window.currentModalData = { docId, docTitle, docUrl };
            setModal('downloadPrompt');
        }

        async function handleDownloadDocument(docId) {
            // This function is called when the student *confirms* the download.
            // We just log the download, the 'href' handles the actual download.
            try {
                await addDoc(downloadsCol(), {
                    docId: docId,
                    studentId: currentUserAuth.uid,
                    studentName: `${currentUserData.fname} ${currentUserData.lname}`,
                    downloadedAt: serverTimestamp()
                });
                console.log("Download logged for doc:", docId);
            } catch (error) {
                console.error("Log Download Error:", error);
            }
            setModal(null); // Close modal
        }
        
        function showSubmitPrompt(assignId, assignTitle) {
            window.currentModalData = { assignId, assignTitle };
            setModal('submitPrompt');
        }

        async function handleSubmitWork(event, assignId) {
            event.preventDefault();
            setLoading(true);

            const workUrl = document.getElementById('submit-url').value;
            
            try {
                await addDoc(submissionsCol(), {
                    assignmentId: assignId,
                    studentId: currentUserAuth.uid,
                    studentName: `${currentUserData.fname} ${currentUserData.lname}`,
                    workUrl: workUrl,
                    submittedAt: serverTimestamp(),
                    isChecked: false,
                    score: null,
                    comment: null
                });
                
                showMessage('สำเร็จ', 'ส่งงานเรียบร้อยแล้ว');
                setModal(null); // Close modal

            } catch (error) {
                console.error("Submit Work Error:", error);
                showMessage('ข้อผิดพลาด', 'ไม่สามารถส่งงานได้', true);
            }
            setLoading(false);
        }
        
    </script>
</body>
</html>
